,e),ref:n,...t}));nv.displayName="Textarea";var nb={};nb=JSON.parse('{"courses":[{"id":"intro","topics":[{"id":"intro-python","num":"01","title":"What is Python?","tag":"print, comments, maths","paras":["A program is a recipe: a list of instructions the computer follows from top to bottom, one line at a time. Python is a language for writing those instructions in words that read almost like English.","The first instruction everyone learns is <code>print</code>. Whatever you put inside the brackets appears on the screen. Text goes inside quotes so Python knows to show it exactly as written. Leave the quotes off and Python works out the maths instead.","A line that starts with <code>#</code> is a comment. Python skips it. Comments are notes for the humans who read your code later, including you."],"code":"print(\\"Namaste, Python!\\")\\nprint(7 + 3)\\nprint(7 / 2)\\nprint(2 ** 3)      # power: 2 x 2 x 2\\nprint(17 // 5)     # whole division, drops the remainder\\nprint(17 % 5)      # only the remainder\\nprint((2 + 3) * 4) # brackets first, like school maths","inputs":null,"output":"Namaste, Python!\\n10\\n3.5\\n8\\n3\\n2\\n20","explain":[{"code":"print(\\"Namaste, Python!\\")","text":"Shows the text on the screen. The quotes tell Python this is text, so it prints it exactly as written."},{"code":"print(7 + 3)","text":"No quotes, so Python does the maths first and prints the answer, 10."},{"code":"print(7 / 2)","text":"A single slash is normal division. It gives 3.5, a number with a decimal point."},{"code":"print(2 ** 3)","text":"Two stars means power: 2 multiplied by itself 3 times, which is 8. The text after # is a comment, and Python ignores it."},{"code":"print(17 // 5)","text":"Double slash divides and throws away the remainder. 5 goes into 17 three whole times, so the answer is 3."},{"code":"print(17 % 5)","text":"The percent sign keeps only the remainder. 17 is 15 + 2, so it prints 2. Useful to check if a number is even."},{"code":"print((2 + 3) * 4)","text":"Brackets are worked out first, so 2 + 3 becomes 5, then 5 × 4 gives 20. Without brackets it would be 14."}],"remember":["Quotes mean text. No quotes means Python calculates.","<code>//</code> keeps the whole part of a division, <code>%</code> keeps the remainder.","Python follows BODMAS: brackets, powers, multiply and divide, then add and subtract."],"task":"Print your name, then print how many minutes are in a week.","video":{"start":56}},{"id":"intro-variables","num":"02","title":"Variables","tag":"boxes that remember","paras":["An answer that is only printed is gone the moment it appears. To remember a value, put it in a variable: a labelled box. The name goes on the label and the value goes inside.","In Python, <code>=</code> does not mean \\"equals\\". It means \\"put this in the box\\". So <code>score = score + 5</code> is not impossible maths: read it right to left. Take what is in score, add 5, and put the result back in score.","Names can use letters, numbers and underscores, cannot start with a number and cannot contain spaces. Python is case sensitive, so <code>age</code> and <code>Age</code> are two different boxes. Pick names that say what is inside, like <code>monthly_salary</code>."],"code":"price = 250\\nquantity = 3\\ndiscount = 100\\n\\ntotal = price * quantity - discount\\nprint(total)\\n\\nscore = 10\\nscore = score + 5\\nscore += 5          # shortcut for the line above\\nprint(score)","inputs":null,"output":"650\\n20","explain":[{"code":"price = 250","text":"Creates a box called price and puts 250 inside. The = means store, not equals."},{"code":"quantity = 3\\ndiscount = 100","text":"Two more boxes, each with a clear name, so anyone reading knows what the numbers mean."},{"code":"total = price * quantity - discount","text":"Python opens the boxes, works out 250 × 3 − 100 = 650, and stores the answer in a new box called total."},{"code":"print(total)","text":"Shows what is inside total: 650."},{"code":"score = 10\\nscore = score + 5","text":"Read the second line right to left: take what is in score (10), add 5, and put 15 back into score."},{"code":"score += 5","text":"A shortcut that means exactly the same as score = score + 5. Now score holds 20."}],"remember":["One <code>=</code> stores a value in a variable.","Change the price in one place and every calculation that uses it updates.","A <code>NameError</code> usually means a typo in a variable name."],"task":"Store your phone bill, streaming subscriptions and chai spending for one month, then print what they cost in a year.","video":{"start":363}},{"id":"intro-types","num":"03","title":"Data types","tag":"int, float, str, bool","paras":["Every value in Python has a type, and the type decides what you can do with it. Whole numbers are <code>int</code>, numbers with a decimal point are <code>float</code>, text is <code>str</code> (short for string), and <code>True</code> or <code>False</code> is <code>bool</code>.","This is why \\"10\\" + \\"5\\" gives \\"105\\". The quotes made them text, and adding text joins it together. Convert first with <code>int()</code>, <code>float()</code> or <code>str()</code> and the maths works again.","Ask Python for any value\'s type with <code>type()</code>. Notice that dividing always gives a float, even when the answer is a whole number."],"code":"print(type(5))\\nprint(type(3.14))\\nprint(type(\\"hello\\"))\\nprint(type(True))\\n\\nprint(\\"10\\" + \\"5\\")\\nprint(int(\\"10\\") + int(\\"5\\"))\\nprint(10 / 2)\\nprint(0.1 + 0.2)   # floats are tiny approximations","inputs":null,"output":"<class \'int\'>\\n<class \'float\'>\\n<class \'str\'>\\n<class \'bool\'>\\n105\\n15\\n5.0\\n0.30000000000000004","explain":[{"code":"print(type(5))","text":"type() tells you what kind of value something is. 5 is a whole number, so it is an int."},{"code":"print(type(3.14))","text":"It has a decimal point, so it is a float."},{"code":"print(type(\\"hello\\"))","text":"Anything inside quotes is text, which Python calls a str (string)."},{"code":"print(type(True))","text":"True and False are their own type, bool, used for yes-or-no answers."},{"code":"print(\\"10\\" + \\"5\\")","text":"Both are text because of the quotes, and + on text glues them together. That is why you get 105."},{"code":"print(int(\\"10\\") + int(\\"5\\"))","text":"int() turns the text into real numbers first, so now + does maths and gives 15."},{"code":"print(10 / 2)","text":"Division always gives a float, so even a whole answer prints as 5.0."},{"code":"print(0.1 + 0.2)","text":"Computers store decimals as tiny approximations, so the answer is a hair off 0.3. Use round() when you show money."}],"remember":["Quotes turn anything into text, even numbers.","Use <code>int()</code> or <code>float()</code> before doing maths on text that holds a number.","<code>0.1 + 0.2</code> being slightly off is normal in every language. Use <code>round()</code> to tidy it."],"task":"Predict the output of <code>print(\\"3\\" * 3)</code> and <code>print(3 * 3)</code>, then run both.","video":{"start":654}},{"id":"intro-text","num":"04","title":"Working with text","tag":"f-strings, indexing, slicing","paras":["Text is a row of characters, and each one has a position. Python counts positions from 0, so the first letter is at position 0. A negative position counts from the end.","A slice like <code>name[1:3]</code> takes characters from position 1 up to, but not including, position 3. Strings also come with built-in tools such as <code>upper()</code>, <code>replace()</code> and <code>split()</code>.","An f-string is the cleanest way to put values inside a sentence. Put an <code>f</code> before the quotes and write variable names inside curly brackets."],"code":"name = \\"Priya\\"\\ncity = \\"Pune\\"\\nprint(f\\"{name} lives in {city}\\")\\nprint(len(name))\\nprint(name[0])\\nprint(name[-1])\\nprint(name[1:3])\\nprint(name.upper())\\nprint(\\"chai,samosa,vada pav\\".split(\\",\\"))","inputs":null,"output":"Priya lives in Pune\\n5\\nP\\na\\nri\\nPRIYA\\n[\'chai\', \'samosa\', \'vada pav\']","explain":[{"code":"name = \\"Priya\\"\\ncity = \\"Pune\\"","text":"Two text variables we will use below."},{"code":"print(f\\"{name} lives in {city}\\")","text":"The f before the quotes makes it an f-string. Python swaps {name} and {city} for their values."},{"code":"print(len(name))","text":"len() counts the characters. Priya has 5 letters."},{"code":"print(name[0])","text":"Square brackets pick one character by position. Counting starts at 0, so [0] is the first letter, P."},{"code":"print(name[-1])","text":"Negative positions count from the end. [-1] is always the last character, a."},{"code":"print(name[1:3])","text":"A slice: from position 1 up to, but not including, 3. That gives the letters at 1 and 2, ri."},{"code":"print(name.upper())","text":"upper() returns a capital-letter copy. The original name is not changed."},{"code":"print(\\"chai,samosa,vada pav\\".split(\\",\\"))","text":"split() cuts the text wherever it finds a comma and gives back a list of the pieces."}],"remember":["Counting starts at 0, not 1.","In a slice the end position is not included.","f-strings beat joining text with <code>+</code> because they convert numbers for you."],"task":"Store your full name and print only your initials using indexing.","video":{"start":902}},{"id":"intro-input","num":"05","title":"Talking to your program","tag":"input()","paras":["<code>input()</code> pauses the program, shows a question, and waits for the user to type something and press Enter. Whatever they type comes back to you as text.","That is the classic beginner trap. If someone types 20 for their age, Python hands you the text \\"20\\", not the number 20. Wrap it in <code>int()</code> or <code>float()</code> before doing any maths."],"code":"bill = float(input(\\"Bill amount: \\"))\\ntip_percent = int(input(\\"Tip %: \\"))\\n\\ntip = bill * tip_percent / 100\\nprint(f\\"Tip: Rs {tip}\\")\\nprint(f\\"Total: Rs {bill + tip}\\")","inputs":"850\\n10","output":"Bill amount: 850\\nTip %: 10\\nTip: Rs 85.0\\nTotal: Rs 935.0","explain":[{"code":"bill = float(input(\\"Bill amount: \\"))","text":"input() shows the question and waits for the user. What they type comes back as text, so float() turns it into a number with decimals."},{"code":"tip_percent = int(input(\\"Tip %: \\"))","text":"Same idea, but int() because a tip percent is a whole number."},{"code":"tip = bill * tip_percent / 100","text":"Works out the percentage: 850 × 10 ÷ 100 = 85.0."},{"code":"print(f\\"Tip: Rs {tip}\\")","text":"An f-string puts the tip inside the sentence."},{"code":"print(f\\"Total: Rs {bill + tip}\\")","text":"You can even do maths inside the curly brackets. 850 + 85 = 935."}],"remember":["<code>input()</code> always returns text.","Convert right away: <code>int(input(...))</code>.","The question inside the brackets is what the user sees."],"task":"Ask for two numbers and print their sum, difference and product.","video":{"start":1227}},{"id":"intro-bool","num":"06","title":"True or False","tag":"comparisons, and, or, not","paras":["A comparison asks Python a yes-or-no question and the answer is always <code>True</code> or <code>False</code>. The operators are <code>==</code> (equal), <code>!=</code> (not equal), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code> and <code>&gt;=</code>.","Watch the difference: one <code>=</code> stores a value, two <code>==</code> compares two values. Mixing them up is one of the most common beginner errors.","Combine questions with <code>and</code> (both must be true), <code>or</code> (at least one is true) and <code>not</code> (flips the answer)."],"code":"marks = 72\\nprint(marks >= 35)\\nprint(marks == 100)\\nprint(marks != 100)\\nprint(marks > 60 and marks < 80)\\nprint(marks < 35 or marks > 90)\\nprint(not marks >= 35)\\nprint(30 < marks < 80)   # chained comparison","inputs":null,"output":"True\\nFalse\\nTrue\\nTrue\\nFalse\\nFalse\\nTrue","explain":[{"code":"marks = 72","text":"The value we will ask questions about."},{"code":"print(marks >= 35)","text":"Is 72 greater than or equal to 35? Yes, so True."},{"code":"print(marks == 100)","text":"Two equals signs compare. 72 is not 100, so False."},{"code":"print(marks != 100)","text":"!= means not equal. 72 is not 100, so True."},{"code":"print(marks > 60 and marks < 80)","text":"and needs both sides to be True. 72 is above 60 and below 80, so True."},{"code":"print(marks < 35 or marks > 90)","text":"or needs at least one side to be True. Neither is, so False."},{"code":"print(not marks >= 35)","text":"not flips the answer. marks >= 35 is True, so not makes it False."},{"code":"print(30 < marks < 80)","text":"Python lets you chain comparisons like in maths: is 72 between 30 and 80? True."}],"remember":["One <code>=</code> stores, two <code>==</code> compares.","<code>and</code> needs both sides true, <code>or</code> needs one.","Text comparisons are case sensitive: <code>\\"Yes\\" == \\"yes\\"</code> is False."],"task":"Store your age and print whether you are old enough to vote in India.","video":{"start":1360}},{"id":"intro-if","num":"07","title":"Decisions with if","tag":"if, elif, else","paras":["<code>if</code> lets your program choose. If the condition is True, the indented lines underneath run. If not, Python skips them. <code>else</code> catches everything that did not match.","When there are more than two roads, use <code>elif</code>. Python checks each condition from the top and runs only the first one that is True, so put the strictest check first.","Indentation (four spaces) is not decoration in Python. It is how Python knows which lines belong to the if."],"code":"marks = 72\\n\\nif marks >= 90:\\n    print(\\"Grade A\\")\\nelif marks >= 60:\\n    print(\\"Grade B\\")\\nelif marks >= 35:\\n    print(\\"Grade C\\")\\nelse:\\n    print(\\"Keep practising\\")\\n\\nnumber = 7\\nif number % 2 == 0:\\n    print(\\"even\\")\\nelse:\\n    print(\\"odd\\")","inputs":null,"output":"Grade B\\nodd","explain":[{"code":"if marks >= 90:","text":"Asks the first question. It ends with a colon, and the indented line below only runs if the answer is True. 72 is not 90 or more, so Python skips it."},{"code":"elif marks >= 60:","text":"elif means else if. Python checks this only because the first one was False. 72 is 60 or more, so this branch runs and prints Grade B."},{"code":"elif marks >= 35:","text":"Skipped. Once one branch has run, Python ignores the rest of the chain."},{"code":"else:","text":"Catches anything that matched none of the questions above."},{"code":"if number % 2 == 0:","text":"% 2 gives the remainder after dividing by 2. If it is 0 the number is even. 7 leaves 1, so the else runs and prints odd."}],"remember":["Only the first True branch runs.","Order matters: check 90 before 60.","A missing colon or wrong indentation is a SyntaxError."],"task":"Write a password checker: print \\"Strong\\" if the password has 8 or more characters, otherwise \\"Too short\\".","video":{"start":1546}},{"id":"intro-lists","num":"08","title":"Lists","tag":"many values in one box","paras":["A list holds many values in one variable, written inside square brackets. Positions start at 0, exactly like text, and <code>-1</code> is the last item.","Unlike text, lists can change. <code>append()</code> adds to the end, you can replace an item by its position, and slicing gives you part of the list.","Python has built-ins that work on whole lists: <code>len()</code>, <code>sum()</code>, <code>max()</code>, <code>min()</code> and <code>sorted()</code>. Together they turn a week of sales into a report in a few lines."],"code":"sales = [120, 95, 140, 80, 160]\\nprint(sales[0])\\nprint(sales[-1])\\nprint(sales[1:3])\\n\\nsales.append(110)\\nsales[1] = 100\\nprint(sales)\\n\\nprint(\\"Total:\\", sum(sales))\\nprint(\\"Best day:\\", max(sales))\\nprint(\\"Average:\\", round(sum(sales) / len(sales), 1))","inputs":null,"output":"120\\n160\\n[95, 140]\\n[120, 100, 140, 80, 160, 110]\\nTotal: 710\\nBest day: 160\\nAverage: 118.3","explain":[{"code":"sales = [120, 95, 140, 80, 160]","text":"One variable holding five values, inside square brackets, separated by commas."},{"code":"print(sales[0])","text":"Position 0 is the first item: 120."},{"code":"print(sales[-1])","text":"Position -1 is the last item: 160."},{"code":"print(sales[1:3])","text":"A slice gives a smaller list: positions 1 and 2, so [95, 140]."},{"code":"sales.append(110)","text":"append() adds a new item to the end. The list now has 6 values."},{"code":"sales[1] = 100","text":"Lists can change. This replaces the item at position 1 (95) with 100."},{"code":"print(\\"Total:\\", sum(sales))","text":"sum() adds every number in the list."},{"code":"print(\\"Best day:\\", max(sales))","text":"max() finds the biggest value."},{"code":"print(\\"Average:\\", round(sum(sales) / len(sales), 1))","text":"Total divided by how many items is the average. round(..., 1) keeps one decimal place."}],"remember":["First item is <code>[0]</code>, last is <code>[-1]</code>.","Lists can grow and change; text cannot.","<code>sum(x) / len(x)</code> is the average."],"task":"Make a list of your last 7 days of screen time and print the total, the highest day and the average.","video":{"start":1858}},{"id":"intro-loops","num":"09","title":"Loops","tag":"for, range, while","paras":["A loop repeats work so you don\'t have to. A <code>for</code> loop goes through every item in a list (or every letter in text) and runs the indented lines once for each.","<code>range(1, 4)</code> gives the numbers 1, 2 and 3. The end number is not included, just like slicing. A very common pattern is to start a total at 0 and add to it inside the loop.","A <code>while</code> loop repeats as long as a condition is True. Make sure something inside the loop changes, or it never stops. <code>break</code> leaves a loop early and <code>continue</code> skips to the next round."],"code":"for lap in range(1, 4):\\n    print(\\"Lap\\", lap)\\n\\ntotal = 0\\nfor amount in [250, 120, 80]:\\n    total += amount\\nprint(\\"Spent:\\", total)\\n\\ncountdown = 3\\nwhile countdown > 0:\\n    print(countdown)\\n    countdown -= 1\\nprint(\\"Go!\\")","inputs":null,"output":"Lap 1\\nLap 2\\nLap 3\\nSpent: 450\\n3\\n2\\n1\\nGo!","explain":[{"code":"for lap in range(1, 4):","text":"range(1, 4) makes the numbers 1, 2, 3 (the 4 is not included). Each time round, lap holds the next number."},{"code":"    print(\\"Lap\\", lap)","text":"The indented line is the loop\'s body. It runs once for every number."},{"code":"total = 0","text":"Start a running total at zero before the loop."},{"code":"for amount in [250, 120, 80]:\\n    total += amount","text":"Goes through each amount and adds it to total: 0 + 250 + 120 + 80 = 450."},{"code":"while countdown > 0:","text":"A while loop keeps going as long as the condition is True."},{"code":"    countdown -= 1","text":"Takes 1 away each time. Without this line countdown would stay at 3 and the loop would never stop."},{"code":"print(\\"Go!\\")","text":"Not indented, so it runs once, after the loop has finished."}],"remember":["<code>for</code> is for \\"each item\\", <code>while</code> is for \\"until\\".","<code>range(a, b)</code> stops before b.","<code>enumerate()</code> gives you the position and the value together."],"task":"Print the 7 times table from 7 x 1 to 7 x 10 with a for loop.","video":{"start":2085}},{"id":"intro-functions","num":"10","title":"Functions","tag":"def, parameters, return","paras":["A function is a recipe with a name. You write it once with <code>def</code> and use it as many times as you like. Inputs go in the brackets (parameters) and <code>return</code> sends the answer back.","<code>print</code> only shows a value on screen. <code>return</code> hands the value back so you can store it or use it in more maths. Most functions should return.","A parameter can have a default value that is used when you leave it out. Variables created inside a function stay inside it; the rest of the program cannot see them."],"code":"def add_gst(price, rate=18):\\n    return price + price * rate / 100\\n\\nprint(add_gst(1000))\\nprint(add_gst(1000, 5))\\n\\ndef take_home(salary, tax_percent):\\n    tax = salary * tax_percent / 100\\n    return salary - tax\\n\\npay = take_home(50000, 10)\\nprint(f\\"Take home: Rs {pay}\\")","inputs":null,"output":"1180.0\\n1050.0\\nTake home: Rs 45000.0","explain":[{"code":"def add_gst(price, rate=18):","text":"def creates a function called add_gst. It takes a price and a rate. rate=18 is a default, used when you don\'t give one."},{"code":"    return price + price * rate / 100","text":"Works out the price plus GST and sends the answer back to whoever called the function."},{"code":"print(add_gst(1000))","text":"Calls the function with only a price, so rate uses the default 18. 1000 + 180 = 1180.0."},{"code":"print(add_gst(1000, 5))","text":"This time we pass 5, which replaces the default. 1000 + 50 = 1050.0."},{"code":"def take_home(salary, tax_percent):","text":"A second function with two inputs."},{"code":"    tax = salary * tax_percent / 100","text":"tax only exists inside the function. The rest of the program cannot see it."},{"code":"pay = take_home(50000, 10)","text":"The returned value, 45000.0, is stored in pay so we can use it later."}],"remember":["Write it once with <code>def</code>, call it many times.","<code>return</code> gives a value back; <code>print</code> only shows it.","Defaults make an argument optional."],"task":"Write <code>celsius_to_f(c)</code> that returns <code>c * 9 / 5 + 32</code> and test it with 37.","video":{"start":2525}},{"id":"intro-dicts","num":"11","title":"Dictionaries and tuples","tag":"look things up by name","paras":["A dictionary stores pairs: a key and its value, like a word and its meaning. Instead of asking for position 0, you ask for a name, such as <code>menu[\\"chai\\"]</code>.","Asking for a key that is not there causes a <code>KeyError</code>. <code>.get()</code> is the safe way: it returns a default you choose instead of crashing. <code>.items()</code> lets you loop through keys and values together.","A tuple is a list that cannot change, written with round brackets. Use it for values that belong together and should stay fixed, like a map coordinate."],"code":"menu = {\\"chai\\": 15, \\"samosa\\": 20, \\"vada pav\\": 25}\\nprint(menu[\\"chai\\"])\\nprint(menu.get(\\"dosa\\", \\"not on the menu\\"))\\n\\nmenu[\\"dosa\\"] = 60\\nfor item, price in menu.items():\\n    print(item, \\"Rs\\", price)\\n\\nhyderabad = (17.38, 78.48)\\nprint(hyderabad[0])","inputs":null,"output":"15\\nnot on the menu\\nchai Rs 15\\nsamosa Rs 20\\nvada pav Rs 25\\ndosa Rs 60\\n17.38","explain":[{"code":"menu = {\\"chai\\": 15, \\"samosa\\": 20, \\"vada pav\\": 25}","text":"A dictionary in curly brackets. Each item is a key, a colon, then its value."},{"code":"print(menu[\\"chai\\"])","text":"Look up by name instead of position. The value for chai is 15."},{"code":"print(menu.get(\\"dosa\\", \\"not on the menu\\"))","text":"dosa is not a key yet. menu[\\"dosa\\"] would crash with KeyError, but .get() returns the default you gave instead."},{"code":"menu[\\"dosa\\"] = 60","text":"Assigning to a new key adds it to the dictionary."},{"code":"for item, price in menu.items():","text":".items() gives each key and value together, so the loop can print both."},{"code":"hyderabad = (17.38, 78.48)","text":"A tuple uses round brackets. Like a list, but it cannot be changed after you create it."},{"code":"print(hyderabad[0])","text":"Tuples use positions just like lists. [0] is the latitude."}],"remember":["Dictionaries look up by key, lists by position.","Use <code>.get(key, default)</code> when a key might be missing.","Tuples cannot be changed after you create them."],"task":"Count how many times each word appears in a sentence using a dictionary.","video":{"start":2878}},{"id":"intro-errors","num":"12","title":"When things go wrong","tag":"tracebacks, try and except","paras":["Errors are not failure. A traceback tells you exactly what went wrong and where. Read the last line first: it names the error type and gives a short reason.","The ones you will meet most are <code>NameError</code> (typo in a name), <code>TypeError</code> (mixing types like text + number), <code>ValueError</code> (<code>int(\\"abc\\")</code>), <code>IndexError</code> (position past the end) and <code>SyntaxError</code> (missing colon, bracket or quote).","<code>try</code> and <code>except</code> let your program handle an error calmly instead of crashing. Put the risky line in <code>try</code> and the backup plan in <code>except</code>."],"code":"try:\\n    age = int(\\"twenty\\")\\nexcept ValueError:\\n    print(\\"Please type your age as a number\\")\\n\\nmarks = [80, 92, 75]\\ntry:\\n    print(marks[3])\\nexcept IndexError:\\n    print(\\"There are only\\", len(marks), \\"marks\\")","inputs":null,"output":"Please type your age as a number\\nThere are only 3 marks","explain":[{"code":"try:","text":"Python tries the indented lines below. If one causes an error, it jumps to the matching except instead of crashing."},{"code":"    age = int(\\"twenty\\")","text":"int() cannot turn the word \\"twenty\\" into a number, so it raises a ValueError."},{"code":"except ValueError:","text":"Catches exactly that error and runs the friendly message instead."},{"code":"marks = [80, 92, 75]","text":"A list with 3 items, at positions 0, 1 and 2."},{"code":"    print(marks[3])","text":"Position 3 does not exist, so this raises an IndexError."},{"code":"except IndexError:","text":"Catches it and explains the problem using len(marks)."}],"remember":["Read the last line of the traceback first.","Catch a specific error type, not every error.","Printing values in the middle of your code is the simplest debugger."],"task":"Ask for a number with input() and print a friendly message if the user types letters.","video":{"start":3088}},{"id":"intro-project","num":"13","title":"Build a real program","tag":"a quiz game","paras":["Everything comes together here: variables keep the score, a list of dictionaries holds the questions, a loop asks each one, <code>input()</code> takes the answer and <code>if</code> checks it.","Once it works, make it yours: add your own questions, give a grade at the end, or let the player try again."],"code":"questions = [\\n    {\\"q\\": \\"Capital of India? \\", \\"a\\": \\"delhi\\"},\\n    {\\"q\\": \\"5 * 6 = ? \\", \\"a\\": \\"30\\"},\\n]\\nscore = 0\\nfor item in questions:\\n    answer = input(item[\\"q\\"]).strip().lower()\\n    if answer == item[\\"a\\"]:\\n        print(\\"Correct!\\")\\n        score += 1\\n    else:\\n        print(\\"Answer:\\", item[\\"a\\"])\\nprint(f\\"You scored {score}/{len(questions)}\\")","inputs":"Delhi\\n35","output":"Capital of India? Delhi\\nCorrect!\\n5 * 6 = ? 35\\nAnswer: 30\\nYou scored 1/2","explain":[{"code":"questions = [ {...}, {...} ]","text":"A list of dictionaries. Each dictionary holds one question (q) and its answer (a)."},{"code":"score = 0","text":"The player starts with no points."},{"code":"for item in questions:","text":"Goes through the questions one at a time. item is the current dictionary."},{"code":"    answer = input(item[\\"q\\"]).strip().lower()","text":"Asks the question. strip() removes extra spaces and lower() makes Delhi and delhi count the same."},{"code":"    if answer == item[\\"a\\"]:","text":"Compares the player\'s answer with the correct one."},{"code":"        score += 1","text":"Adds a point only for a right answer."},{"code":"print(f\\"You scored {score}/{len(questions)}\\")","text":"After the loop, shows the final score out of the number of questions."}],"remember":["Plan the data first, then the loop.","<code>.strip().lower()</code> forgives extra spaces and capitals.","Build one small piece, run it, then add the next."],"task":"Add three questions of your own and print \\"Topper!\\" for a perfect score.","video":{"start":3259}}]},{"id":"data","topics":[{"id":"data-libraries","num":"01","title":"Libraries","tag":"import superpowers","paras":["A library is code someone else already wrote and tested, ready for you to use. You bring it into your program with <code>import</code>. Python ships with many (math, random, datetime), and the data world runs on two more: NumPy for fast maths on numbers and Pandas for tables.","By convention NumPy is imported as <code>np</code> and Pandas as <code>pd</code>. Google Colab and Kaggle notebooks already have both installed; on your own computer you install them once with <code>pip install numpy pandas</code>."],"code":"import math\\nimport numpy as np\\nimport pandas as pd\\n\\nprint(math.sqrt(144))\\nprint(round(1999 * 0.18, 2))   # GST on Rs 1999\\nprint(math.ceil(4.2))          # always rounds up\\nprint(np.array([1, 2, 3]) * 10)","inputs":null,"output":"12.0\\n359.82\\n5\\n[10 20 30]","explain":[{"code":"import math","text":"Brings in Python\'s built-in maths library so you can use its tools."},{"code":"import numpy as np","text":"Brings in NumPy and gives it the short name np. Everyone uses this name."},{"code":"import pandas as pd","text":"Brings in Pandas with the short name pd."},{"code":"print(math.sqrt(144))","text":"Use a library\'s tool with libraryname.tool. sqrt gives the square root, 12.0."},{"code":"print(round(1999 * 0.18, 2))","text":"18% GST on Rs 1999, rounded to 2 decimal places for money."},{"code":"print(math.ceil(4.2))","text":"ceil always rounds up, so 4.2 becomes 5."},{"code":"print(np.array([1, 2, 3]) * 10)","text":"A first taste of NumPy: every number in the array is multiplied by 10."}],"remember":["<code>import</code> once at the top of your file.","<code>np</code> and <code>pd</code> are the names everyone uses.","Colab and Kaggle need no installation."],"task":"Import random and simulate rolling a dice 5 times.","video":null},{"id":"data-files","num":"02","title":"Files","tag":"data that survives","paras":["Variables vanish when the program ends. Files survive. <code>open()</code> with <code>\\"w\\"</code> writes a new file, <code>\\"a\\"</code> adds to the end, and no mode at all reads it.","The <code>w</code> trap: opening an existing file with <code>\\"w\\"</code> wipes it before writing. Use <code>\\"a\\"</code> when you want to keep what is there.","<code>with open(...) as f:</code> closes the file for you when the block ends. CSV (comma-separated values) is the plain-text format almost all data comes in: one row per line, columns split by commas."],"code":"with open(\\"chai.csv\\", \\"w\\") as f:\\n    f.write(\\"day,cups\\\\n\\")\\n    f.write(\\"Mon,3\\\\n\\")\\n\\nwith open(\\"chai.csv\\", \\"a\\") as f:\\n    f.write(\\"Tue,5\\\\n\\")\\n\\nwith open(\\"chai.csv\\") as f:\\n    print(f.read())","inputs":null,"output":"day,cups\\nMon,3\\nTue,5","explain":[{"code":"with open(\\"chai.csv\\", \\"w\\") as f:","text":"Opens (or creates) the file for writing. \\"w\\" wipes anything already in it. with closes the file automatically at the end."},{"code":"    f.write(\\"day,cups\\\\n\\")","text":"Writes one line. \\\\n means new line, so the next write starts on its own row."},{"code":"with open(\\"chai.csv\\", \\"a\\") as f:","text":"\\"a\\" means append: add to the end and keep what is already there."},{"code":"with open(\\"chai.csv\\") as f:","text":"No mode means read."},{"code":"    print(f.read())","text":"read() gives back the whole file as text, so you see all three rows."}],"remember":["<code>\\"w\\"</code> overwrites, <code>\\"a\\"</code> appends.","Always use <code>with</code> so the file is closed.","A CSV is just text with commas."],"task":"Write a chai counter that appends today\'s cups to a file and prints the total so far.","video":null},{"id":"data-numpy","num":"03","title":"NumPy","tag":"maths on whole lists","paras":["Multiply a Python list by 2 and it repeats the list. Multiply a NumPy array by 2 and every number doubles. That is the whole idea: one operation on every item at once, with no loop, and much faster on big data.","Arrays come with statistics built in (<code>mean()</code>, <code>max()</code>, <code>sum()</code>). You can also ask a yes-or-no question of every item at once and use the answer to filter, like \\"which innings were 50 or more?\\""],"code":"import numpy as np\\n\\nprices = [100, 250, 80]\\nprint(prices * 2)\\nprint(np.array(prices) * 2)\\n\\nruns = np.array([45, 12, 78, 3, 101, 34, 0, 56, 22, 67])\\nprint(\\"Average:\\", runs.mean())\\nprint(\\"Best:\\", runs.max())\\nprint(runs >= 50)\\nprint(\\"Fifties:\\", runs[runs >= 50])","inputs":null,"output":"[100, 250, 80, 100, 250, 80]\\n[200 500 160]\\nAverage: 41.8\\nBest: 101\\n[False False  True False  True False False  True False  True]\\nFifties: [ 78 101  56  67]","explain":[{"code":"prices = [100, 250, 80]","text":"A normal Python list."},{"code":"print(prices * 2)","text":"Multiplying a list repeats it, which is almost never what you want for data."},{"code":"print(np.array(prices) * 2)","text":"Turn it into a NumPy array and * 2 doubles every number instead."},{"code":"runs = np.array([...])","text":"A batter\'s last 10 innings as an array."},{"code":"print(\\"Average:\\", runs.mean())","text":"Arrays have statistics built in. mean() is the average, 41.8."},{"code":"print(runs >= 50)","text":"Asks the question of every innings at once and gives back True or False for each one."},{"code":"print(\\"Fifties:\\", runs[runs >= 50])","text":"Putting that True/False array inside the brackets keeps only the True items: the fifties and hundreds."}],"remember":["A list repeats, an array calculates.","<code>arr[arr &gt;= 50]</code> keeps only the matching items.","Arrays can be 2D tables: <code>arr.shape</code> tells you rows and columns."],"task":"Store a week of temperatures for your city and print the days above the average.","video":null},{"id":"data-pandas","num":"04","title":"Pandas","tag":"Excel inside Python","paras":["Pandas gives you a <code>DataFrame</code>: a table with named columns, like an Excel sheet you control with code. A single column is a <code>Series</code>.","Always start with a first look: <code>head()</code> shows the top rows, <code>shape</code> the size and <code>describe()</code> quick statistics. One bracket <code>df[\\"maths\\"]</code> gives one column; two brackets <code>df[[\\"name\\", \\"maths\\"]]</code> give a smaller table.","Make new columns with plain maths, filter rows with a condition in brackets, and sort with <code>sort_values()</code>. When you combine conditions, use <code>&amp;</code> and put each condition in its own brackets."],"code":"import pandas as pd\\n\\ndf = pd.read_csv(\\"marks.csv\\")\\ndf[\\"total\\"] = df[\\"maths\\"] + df[\\"science\\"]\\nprint(df)\\nprint()\\nprint(df[df[\\"maths\\"] > 70][[\\"name\\", \\"maths\\"]])\\nprint()\\nprint(df.sort_values(\\"total\\", ascending=False).head(2))","inputs":null,"output":"    name  maths  science  total\\n0  Aarav     78       85    163\\n1  Priya     92       88    180\\n2  Rahul     65       70    135\\n3  Sneha     88       94    182\\n\\n    name  maths\\n0  Aarav     78\\n1  Priya     92\\n3  Sneha     88\\n\\n    name  maths  science  total\\n3  Sneha     88       94    182\\n1  Priya     92       88    180","explain":[{"code":"df = pd.read_csv(\\"marks.csv\\")","text":"Reads the file into a DataFrame, a table with named columns. df is the usual name."},{"code":"df[\\"total\\"] = df[\\"maths\\"] + df[\\"science\\"]","text":"Adds two whole columns row by row and saves the result as a new column called total."},{"code":"print(df)","text":"Shows the table with the new column."},{"code":"df[df[\\"maths\\"] > 70]","text":"The inner part asks True/False for every row. The outer df[...] keeps only the True rows."},{"code":"[[\\"name\\", \\"maths\\"]]","text":"Two brackets pick a list of columns, giving a smaller table."},{"code":"df.sort_values(\\"total\\", ascending=False).head(2)","text":"Sorts from highest total to lowest, then head(2) keeps the top two rows."}],"remember":["One bracket = a column, two brackets = a table.","Filters: <code>df[(cond1) &amp; (cond2)]</code>, never <code>and</code>.","<code>loc</code> selects by label, <code>iloc</code> by position."],"task":"Add a percentage column (total out of 200) and show only students above 75%.","video":null},{"id":"data-real","num":"05","title":"Real data from a CSV","tag":"UPI spends, dates, groupby","paras":["One line, <code>pd.read_csv()</code> (or <code>pd.read_excel()</code>), turns a whole file into a table. From there you can ask real money questions: where does my money go?","<code>groupby()</code> answers \\"for each category, how much?\\" in one line. <code>value_counts()</code> tells you how often, <code>sum()</code> tells you how much, and they often give different answers: chai is frequent but cheap, rent is rare but huge.","The average can lie when one big payment pulls it up. The median, the middle value, is often the fairer number. Clean messy text with <code>.str.strip()</code> and <code>.str.title()</code>, and save results with <code>to_csv()</code>."],"code":"import pandas as pd\\n\\nupi = pd.read_csv(\\"upi_spends.csv\\", parse_dates=[\\"date\\"])\\nprint(upi.shape)\\nprint(upi.groupby(\\"category\\")[\\"amount\\"].sum().sort_values(ascending=False).head(4))\\nprint()\\nprint(upi[\\"paid_to\\"].value_counts().head(3))\\nprint()\\nprint(\\"Mean:\\", round(upi[\\"amount\\"].mean()), \\" Median:\\", upi[\\"amount\\"].median())","inputs":null,"output":"(104, 4)\\ncategory\\nRent             36000\\nGroceries        10645\\nFood delivery     4532\\nBills             3967\\nName: amount, dtype: int64\\n\\npaid_to\\nRaju Tea Stall    55\\nZomato            10\\nBigBasket          9\\nName: count, dtype: int64\\n\\nMean: 590  Median: 60.0","explain":[{"code":"upi = pd.read_csv(\\"upi_spends.csv\\", parse_dates=[\\"date\\"])","text":"Reads three months of UPI payments. parse_dates turns the date column into real dates."},{"code":"print(upi.shape)","text":"Rows and columns: 104 payments, 4 columns."},{"code":"upi.groupby(\\"category\\")[\\"amount\\"].sum()","text":"For each category, add up the amount. This answers where the money went."},{"code":".sort_values(ascending=False).head(4)","text":"Biggest first, and keep the top 4."},{"code":"upi[\\"paid_to\\"].value_counts().head(3)","text":"Counts how many payments went to each person or shop. Chai wins on count even though rent wins on money."},{"code":"upi[\\"amount\\"].mean() / .median()","text":"The mean (590) is pulled up by rent. The median (60) is the middle payment and describes a typical spend better."}],"remember":["<code>groupby(col)[value].sum()</code> is the most useful line in data work.","How often and how much are different questions.","Check the median when one value is huge."],"task":"Find which day of the week you spend the most (hint: <code>upi[\\"date\\"].dt.day_name()</code>).","video":null},{"id":"data-projects","num":"06","title":"Mini projects","tag":"cricket, budget, results","paras":["Three small projects put it all together. A colony cricket league: count wins per team from a matches file and build the points table. A monthly budget check: compare what you spent in each category against a limit. An exam result card: totals, percentages and grades for every student.","Finish with one line chart using <code>df.plot()</code>, and you have gone from raw file to answer to picture."],"code":"import pandas as pd\\n\\nmatches = pd.read_csv(\\"matches.csv\\")\\ntable = matches[\\"winner\\"].value_counts().rename(\\"wins\\").to_frame()\\ntable[\\"points\\"] = table[\\"wins\\"] * 2\\nprint(table)","inputs":null,"output":"                  wins  points\\nwinner                        \\nChennai Chargers     4       8\\nMumbai Mavericks     3       6\\nDelhi Dynamos        3       6\\nKolkata Knights      3       6\\nHyderabad Hawks      2       4","explain":[{"code":"matches = pd.read_csv(\\"matches.csv\\")","text":"Loads the colony cricket league results: one row per match with the winner."},{"code":"matches[\\"winner\\"].value_counts()","text":"Counts how many times each team appears as winner, which is its number of wins."},{"code":".rename(\\"wins\\").to_frame()","text":"Names that count wins and turns it into a table so we can add more columns."},{"code":"table[\\"points\\"] = table[\\"wins\\"] * 2","text":"Two points for a win, like a real league table."}],"remember":["Start every project with <code>head()</code> and <code>shape</code>.","Most answers are a groupby or a value_counts.","Practice on Kaggle or Google Colab, both free in your browser."],"task":"Load your own expenses into a CSV and find your top three categories.","video":null}]}],"datafiles":{"marks.csv":"name,maths,science\\nAarav,78,85\\nPriya,92,88\\nRahul,65,70\\nSneha,88,94\\n","matches.csv":"match,team1,team2,winner\\n1,Chennai Chargers,Delhi Dynamos,Chennai Chargers\\n2,Mumbai Mavericks,Hyderabad Hawks,Mumbai Mavericks\\n3,Chennai Chargers,Bengaluru Blasters,Chennai Chargers\\n4,Mumbai Mavericks,Delhi Dynamos,Delhi Dynamos\\n5,Delhi Dynamos,Hyderabad Hawks,Delhi Dynamos\\n6,Chennai Chargers,Hyderabad Hawks,Chennai Chargers\\n7,Kolkata Knights,Bengaluru Blasters,Kolkata Knights\\n8,Bengaluru Blasters,Hyderabad Hawks,Hyderabad Hawks\\n9,Chennai Chargers,Kolkata Knights,Kolkata Knights\\n10,Kolkata Knights,Hyderabad Hawks,Hyderabad Hawks\\n11,Delhi Dynamos,Bengaluru Blasters,Delhi Dynamos\\n12,Mumbai Mavericks,Bengaluru Blasters,Mumbai Mavericks\\n13,Mumbai Mavericks,Kolkata Knights,Mumbai Mavericks\\n14,Delhi Dynamos,Kolkata Knights,Kolkata Knights\\n15,Chennai Chargers,Mumbai Mavericks,Chennai Chargers\\n","upi_spends.csv":"date,paid_to,category,amount\\n2026-08-01,Landlord,Rent,12000\\n2026-08-02,Raju Tea Stall,Chai & snacks,50\\n2026-08-03,Raju Tea Stall,Chai & snacks,50\\n2026-08-03,Zomato,Food delivery,189\\n2026-08-04,Raju Tea Stall,Chai & snacks,30\\n2026-08-05,BigBasket,Groceries,1530\\n  variable పేరులో టైపో ఉందని అర్థం."],"task":"ఒక నెల ఫోన్ బిల్లు, స్ట్రీమింగ్ సబ్‌స్క్రిప్షన్లు, చాయ్ ఖర్చును variables లో పెట్టి, ఒక సంవత్సరానికి ఎంత అవుతుందో print చేయండి."},"intro-types":{"paras":["Python లో ప్రతి విలువకు ఒక type ఉంటుంది, దానితో ఏం చేయొచ్చో ఆ type నిర్ణయిస్తుంది. పూర్ణ సంఖ్యలు <code>int</code>, దశాంశ బిందువు ఉన్న సంఖ్యలు <code>float</code>, టెక్స్ట్ <code>str</code> (string కి షార్ట్), <code>True</code> లేదా <code>False</code> అంటే <code>bool</code>.","అందుకే \\"10\\" + \\"5\\" ఇస్తే \\"105\\" వస్తుంది. కోట్స్ వాటిని టెక్స్ట్‌గా మార్చాయి, టెక్స్ట్‌ను కలిపితే అవి జతకలుస్తాయి. ముందు <code>int()</code>, <code>float()</code> లేదా <code>str()</code> తో మార్చండి, అప్పుడు లెక్క మళ్ళీ సరిగ్గా పనిచేస్తుంది.","ఏ విలువ type అయినా <code>type()</code> తో అడగొచ్చు. గమనించండి: భాగహారం ఎప్పుడూ float నే ఇస్తుంది, జవాబు పూర్ణ సంఖ్య అయినా సరే."],"remember":["కోట్స్ దేన్నైనా టెక్స్ట్‌గా మారుస్తాయి, అంకెలను కూడా.","సంఖ్య ఉన్న టెక్స్ట్‌తో లెక్క చేసే ముందు <code>int()</code> లేదా <code>float()</code> వాడండి.","<code>0.1 + 0.2</code> కొంచెం తేడాగా రావడం ప్రతి భాషలోనూ సహజం. <code>round()</code> తో సరిచేయండి."],"task":"<code>print(\\"3\\" * 3)</code> మరియు <code>print(3 * 3)</code> ఏమి చూపిస్తాయో ముందు ఊహించండి, తర్వాత రెండూ run చేయండి."},"intro-text":{"paras":["టెక్స్ట్ అంటే అక్షరాల వరుస, ప్రతి అక్షరానికి ఒక స్థానం ఉంటుంది. Python స్థానాలను 0 నుండి లెక్కిస్తుంది, కాబట్టి మొదటి అక్షరం స్థానం 0. నెగటివ్ స్థానం చివరి నుండి లెక్కిస్తుంది.","<code>name[1:3]</code> లాంటి slice స్థానం 1 నుండి స్థానం 3 వరకు (3 కాకుండా) అక్షరాలను తీసుకుంటుంది. Strings తో <code>upper()</code>, <code>replace()</code>, <code>split()</code> లాంటి సిద్ధంగా ఉన్న టూల్స్ కూడా వస్తాయి.","ఒక వాక్యంలో విలువలను పెట్టడానికి f-string అత్యంత సులభమైన మార్గం. కోట్స్ ముందు <code>f</code> పెట్టి, variable పేర్లను కర్లీ బ్రాకెట్లలో రాయండి."],"remember":["లెక్కింపు 0 నుండి మొదలవుతుంది, 1 నుండి కాదు.","slice లో చివరి స్థానం చేర్చబడదు.","<code>+</code> తో టెక్స్ట్ కలపడం కంటే f-strings మంచివి, ఎందుకంటే అవి సంఖ్యలను మీ కోసం మారుస్తాయి."],"task":"మీ పూర్తి పేరును దాచి, indexing వాడి కేవలం మీ initials మాత్రమే print చేయండి."},"intro-input":{"paras":["<code>input()</code> ప్రోగ్రామ్‌ను ఆపి, ఒక ప్రశ్న చూపించి, యూజర్ ఏదైనా టైప్ చేసి Enter నొక్కే వరకు వేచి ఉంటుంది. వాళ్ళు ఏం టైప్ చేసినా అది మీకు టెక్స్ట్‌గా వస్తుంది.","ఇదే బిగినర్స్ పడే పెద్ద ఉచ్చు. ఎవరైనా వయసు 20 అని టైప్ చేస్తే, Python మీకు ఇచ్చేది \\"20\\" అనే టెక్స్ట్, 20 అనే సంఖ్య కాదు. ఏదైనా లెక్క చేసే ముందు దాన్ని <code>int()</code> లేదా <code>float()</code> లో పెట్టండి."],"remember":["<code>input()</code> ఎప్పుడూ టెక్స్ట్‌నే ఇస్తుంది.","వెంటనే మార్చండి: <code>int(input(...))</code>.","బ్రాకెట్లలోని ప్రశ్నే యూజర్‌కు కనిపిస్తుంది."],"task":"రెండు సంఖ్యలు అడిగి, వాటి మొత్తం, తేడా, గుణకారం print చేయండి."},"intro-bool":{"paras":["ఒక పోలిక Python ని అవును-కాదు ప్రశ్న అడుగుతుంది, జవాబు ఎప్పుడూ <code>True</code> లేదా <code>False</code>. ఆపరేటర్లు: <code>==</code> (సమానం), <code>!=</code> (సమానం కాదు), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>.","తేడా గమనించండి: ఒక <code>=</code> విలువను దాచుతుంది, రెండు <code>==</code> రెండు విలువలను పోలుస్తాయి. వీటిని కలగలపడం బిగినర్స్ చేసే అతి సాధారణ తప్పుల్లో ఒకటి.","ప్రశ్నలను కలపడానికి <code>and</code> (రెండూ నిజం కావాలి), <code>or</code> (కనీసం ఒకటి నిజం), <code>not</code> (జవాబును తిప్పుతుంది) వాడండి."],"remember":["ఒక <code>=</code> దాచుతుంది, రెండు <code>==</code> పోలుస్తాయి.","<code>and</code> కి రెండు వైపులా నిజం కావాలి, <code>or</code> కి ఒకటి చాలు.","టెక్స్ట్ పోలికలు కేస్ సెన్సిటివ్: <code>\\"Yes\\" == \\"yes\\"</code> అనేది False."],"task":"మీ వయసును దాచి, భారతదేశంలో ఓటు వేయడానికి మీకు సరిపడా వయసు ఉందో లేదో print చేయండి."},"intro-if":{"paras":["<code>if</code> మీ ప్రోగ్రామ్‌కు ఎంచుకునే శక్తి ఇస్తుంది. షరతు True అయితే, కింద indent చేసిన లైన్లు run అవుతాయి. కాకపోతే Python వాటిని వదిలేస్తుంది. సరిపోని మిగతా అన్నింటినీ <code>else</code> పట్టుకుంటుంది.","రెండు కంటే ఎక్కువ దారులు ఉన్నప్పుడు <code>elif</code> వాడండి. Python పై నుండి ప్రతి షరతును చెక్ చేసి, మొదట True అయిన దాన్ని మాత్రమే run చేస్తుంది, కాబట్టి కఠినమైన చెక్‌ను ముందు పెట్టండి.","Python లో indentation (నాలుగు స్పేస్‌లు) అలంకారం కాదు. ఏ లైన్లు if కి చెందుతాయో Python కి తెలిసేది దాని ద్వారానే."],"remember":["మొదటి True బ్రాంచ్ మాత్రమే run అవుతుంది.","క్రమం ముఖ్యం: 60 కంటే ముందు 90 చెక్ చేయండి.","colon మిస్ అయినా, indentation తప్పినా SyntaxError వస్తుంది."],"task":"ఒక password checker రాయండి: password లో 8 లేదా అంతకంటే ఎక్కువ అక్షరాలు ఉంటే \\"Strong\\", లేకపోతే \\"Too short\\" అని print చేయండి."},"intro-lists":{"paras":["ఒక list చాలా విలువలను ఒకే variable లో దాచుతుంది, స్క్వేర్ బ్రాకెట్లలో రాస్తాం. టెక్స్ట్ లాగానే స్థానాలు 0 నుండి మొదలవుతాయి, <code>-1</code> అంటే చివరి ఐటమ్.","టెక్స్ట్ లాగా కాకుండా lists మారగలవు. <code>append()</code> చివరకు కలుపుతుంది, స్థానం ద్వారా ఐటమ్‌ను మార్చొచ్చు, slicing తో list లో కొంత భాగం తీసుకోవచ్చు.","మొత్తం list మీద పనిచేసే సిద్ధమైన టూల్స్ Python లో ఉన్నాయి: <code>len()</code>, <code>sum()</code>, <code>max()</code>, <code>min()</code>, <code>sorted()</code>. ఇవి కలిసి ఒక వారం అమ్మకాలను కొన్ని లైన్లలోనే రిపోర్ట్‌గా మారుస్తాయి."],"remember":["మొదటి ఐటమ్ <code>[0]</code>, చివరిది <code>[-1]</code>.","Lists పెరగగలవు, మారగలవు; టెక్స్ట్ మారదు.","<code>sum(x) / len(x)</code> అంటే సగటు."],"task":"గత 7 రోజుల మీ స్క్రీన్ టైమ్‌తో ఒక list చేసి, మొత్తం, ఎక్కువ రోజు, సగటు print చేయండి."},"intro-loops":{"paras":["Loop పనిని మళ్ళీ మళ్ళీ చేస్తుంది, మీరు చేయాల్సిన అవసరం లేదు. <code>for</code> loop ఒక list లోని ప్రతి ఐటమ్ (లేదా టెక్స్ట్‌లోని ప్రతి అక్షరం) గుండా వెళ్ళి, indent చేసిన లైన్లను ఒక్కోదానికి ఒకసారి run చేస్తుంది.","<code>range(1, 4)</code> 1, 2, 3 సంఖ్యలను ఇస్తుంది. slicing లాగానే చివరి సంఖ్య చేర్చబడదు. చాలా సాధారణ పద్ధతి: total ను 0 తో మొదలుపెట్టి, loop లోపల దానికి కలుపుతూ వెళ్ళడం.","<code>while</code> loop షరతు True గా ఉన్నంత కాలం పునరావృతమవుతుంది. loop లోపల ఏదో ఒకటి మారేలా చూసుకోండి, లేకపోతే అది ఎప్పటికీ ఆగదు. <code>break</code> loop నుండి ముందే బయటకు వస్తుంది, <code>continue</code> తర్వాతి రౌండ్‌కు దాటుతుంది."],"remember":["<code>for</code> అంటే \\"ప్రతి ఐటమ్‌కు\\", <code>while</code> అంటే \\"అయ్యే వరకు\\".","<code>range(a, b)</code> b కి ముందే ఆగుతుంది.","<code>enumerate()</code> స్థానాన్ని, విలువను కలిపి ఇస్తుంది."],"task":"for loop తో 7 ఎక్కం 7 x 1 నుండి 7 x 10 వరకు print చేయండి."},"intro-functions":{"paras":["Function అంటే పేరున్న వంటకం. <code>def</code> తో ఒకసారి రాసి, ఎన్నిసార్లైనా వాడొచ్చు. ఇన్‌పుట్‌లు బ్రాకెట్లలోకి (parameters) వెళ్తాయి, <code>return</code> జవాబును తిరిగి పంపుతుంది.","<code>print</code> విలువను స్క్రీన్ మీద చూపిస్తుంది అంతే. <code>return</code> విలువను తిరిగి ఇస్తుంది, కాబట్టి దాన్ని దాచుకోవచ్చు లేదా ఇంకా లెక్కల్లో వాడొచ్చు. చాలా functions return చేయాలి.","Parameter కి default విలువ ఉండొచ్చు, మీరు ఇవ్వకపోతే అదే వాడబడుతుంది. Function లోపల సృష్టించిన variables లోపలే ఉంటాయి; మిగతా ప్రోగ్రామ్‌కు అవి కనిపించవు."],"remember":["<code>def</code> తో ఒకసారి రాయండి, ఎన్నిసార్లైనా పిలవండి.","<code>return</code> విలువను తిరిగి ఇస్తుంది; <code>print</code> కేవలం చూపిస్తుంది.","Defaults ఒక argument ను ఐచ్ఛికం చేస్తాయి."],"task":"<code>c * 9 / 5 + 32</code> ను return చేసే <code>celsius_to_f(c)</code> రాసి, 37 తో పరీక్షించండి."},"intro-dicts":{"paras":["Dictionary జతలను దాచుతుంది: ఒక key మరియు దాని value, పదం మరియు దాని అర్థం లాగా. స్థానం 0 అడిగే బదులు, ఒక పేరు అడుగుతారు, ఉదాహరణకు <code>menu[\\"chai\\"]</code>.","లేని key అడిగితే <code>KeyError</code> వస్తుంది. <code>.get()</code> సురక్షితమైన మార్గం: crash అయ్యే బదులు మీరు ఎంచుకున్న default ఇస్తుంది. <code>.items()</code> తో keys, values ని కలిపి loop చేయొచ్చు.","Tuple అంటే మారని list, రౌండ్ బ్రాకెట్లతో రాస్తాం. కలిసి ఉండాల్సిన, మారకూడని విలువలకు వాడండి, మ్యాప్ కోఆర్డినేట్ లాగా."],"remember":["Dictionaries key తో వెతుకుతాయి, lists స్థానంతో.","Key లేకపోవచ్చు అనుకుంటే <code>.get(key, default)</code> వాడండి.","Tuples సృష్టించిన తర్వాత మార్చలేము."],"task":"ఒక వాక్యంలో ప్రతి పదం ఎన్నిసార్లు వచ్చిందో dictionary తో లెక్కించండి."},"intro-errors":{"paras":["Errors అంటే ఓటమి కాదు. Traceback ఏం తప్పు జరిగిందో, ఎక్కడ జరిగిందో సరిగ్గా చెబుతుంది. ముందు చివరి లైన్ చదవండి: అది error type పేరు, చిన్న కారణం చెబుతుంది.","మీరు ఎక్కువగా చూసేవి: <code>NameError</code> (పేరులో టైపో), <code>TypeError</code> (టెక్స్ట్ + సంఖ్య లాగా types కలపడం), <code>ValueError</code> (<code>int(\\"abc\\")</code>), <code>IndexError</code> (చివరి ఐటమ్ దాటిన స్థానం), <code>SyntaxError</code> (colon, బ్రాకెట్ లేదా కోట్ మిస్ అవ్వడం).","<code>try</code> మరియు <code>except</code> మీ ప్రోగ్రామ్ crash అవ్వకుండా error ను ప్రశాంతంగా హ్యాండిల్ చేసేలా చేస్తాయి. రిస్క్ ఉన్న లైన్‌ను <code>try</code> లో, బ్యాకప్ ప్లాన్‌ను <code>except</code> లో పెట్టండి."],"remember":["Traceback లో ముందు చివరి లైన్ చదవండి.","ప్రతి error ను కాదు, ఒక నిర్దిష్ట error type ను పట్టుకోండి.","కోడ్ మధ్యలో విలువలను print చేయడమే అత్యంత సులభమైన debugger."],"task":"input() తో ఒక సంఖ్య అడిగి, యూజర్ అక్షరాలు టైప్ చేస్తే స్నేహపూర్వక సందేశం print చేయండి."},"intro-project":{"paras":["ఇక్కడ అన్నీ కలిసి వస్తాయి: variables స్కోర్‌ను గుర్తుంచుకుంటాయి, dictionaries ఉన్న list ప్రశ్నలను దాచుతుంది, loop ప్రతి ప్రశ్న అడుగుతుంది, <code>input()</code> జవాబు తీసుకుంటుంది, <code>if</code> దాన్ని చెక్ చేస్తుంది.","పనిచేసిన తర్వాత దాన్ని మీదిగా మార్చుకోండి: మీ సొంత ప్రశ్నలు కలపండి, చివర్లో గ్రేడ్ ఇవ్వండి, లేదా ఆటగాడు మళ్ళీ ప్రయత్నించేలా చేయండి."],"remember":["ముందు డేటాను ప్లాన్ చేయండి, తర్వాత loop.","<code>.strip().lower()</code> అదనపు స్పేస్‌లు, క్యాపిటల్స్‌ను క్షమిస్తుంది.","ఒక చిన్న భాగం కట్టి, run చేసి, తర్వాత ఇంకోటి కలపండి."],"task":"మీ సొంత మూడు ప్రశ్నలు కలిపి, పూర్తి స్కోర్ వస్తే \\"Topper!\\" అని print చేయండి."},"data-libraries":{"paras":["Library అంటే వేరే ఎవరో ఇప్పటికే రాసి, పరీక్షించిన కోడ్, మీరు వాడటానికి సిద్ధంగా ఉంటుంది. <code>import</code> తో దాన్ని మీ ప్రోగ్రామ్‌లోకి తెస్తారు. Python తో చాలా వస్తాయి (math, random, datetime), డేటా ప్రపంచం ఇంకో రెండింటి మీద నడుస్తుంది: సంఖ్యల మీద వేగవంతమైన లెక్కలకు NumPy, టేబుల్స్ కోసం Pandas.","అలవాటు ప్రకారం NumPy ని <code>np</code> గా, Pandas ని <code>pd</code> గా import చేస్తారు. Google Colab, Kaggle notebooks లో రెండూ ముందే ఇన్‌స్టాల్ అయి ఉంటాయి; మీ కంప్యూటర్‌లో <code>pip install numpy pandas</code> తో ఒకసారి ఇన్‌స్టాల్ చేస్తారు."],"remember":["మీ ఫైల్ పైభాగంలో ఒకసారి <code>import</code> చేయండి.","<code>np</code> మరియు <code>pd</code> అందరూ వాడే పేర్లు.","Colab, Kaggle లో ఇన్‌స్టాలేషన్ అవసరం లేదు."],"task":"random ని import చేసి, పాచికను 5 సార్లు వేసినట్టు simulate చేయండి."},"data-files":{"paras":["ప్రోగ్రామ్ ముగియగానే variables మాయమవుతాయి. ఫైల్స్ నిలిచి ఉంటాయి. <code>open()</code> లో <code>\\"w\\"</code> కొత్త ఫైల్ రాస్తుంది, <code>\\"a\\"</code> చివరకు కలుపుతుంది, ఏ మోడ్ లేకపోతే చదువుతుంది.","<code>w</code> ఉచ్చు: ఉన్న ఫైల్‌ను <code>\\"w\\"</code> తో ఓపెన్ చేస్తే రాసే ముందే అది ఖాళీ అవుతుంది. ఉన్నదాన్ని ఉంచాలంటే <code>\\"a\\"</code> వాడండి.","<code>with open(...) as f:</code> బ్లాక్ ముగిసినప్పుడు ఫైల్‌ను మీ కోసం మూసేస్తుంది. CSV (comma-separated values) దాదాపు అన్ని డేటా వచ్చే సాధారణ టెక్స్ట్ ఫార్మాట్: ఒక్కో లైన్‌కు ఒక వరుస, కామాలతో వేరైన కాలమ్స్."],"remember":["<code>\\"w\\"</code> పాతదాన్ని చెరిపేస్తుంది, <code>\\"a\\"</code> కలుపుతుంది.","ఫైల్ మూసేలా ఎప్పుడూ <code>with</code> వాడండి.","CSV అంటే కామాలు ఉన్న టెక్స్ట్ మాత్రమే."],"task":"ఈ రోజు తాగిన చాయ్ కప్పులను ఫైల్‌కు కలిపి, ఇప్పటి వరకు మొత్తం print చేసే చాయ్ కౌంటర్ రాయండి."},"data-numpy":{"paras":["Python list ని 2 తో గుణిస్తే list రెండుసార్లు రిపీట్ అవుతుంది. NumPy array ని 2 తో గుణిస్తే ప్రతి సంఖ్య రెట్టింపు అవుతుంది. ఇదే మొత్తం ఆలోచన: loop లేకుండా ప్రతి ఐటమ్ మీద ఒకేసారి ఒక ఆపరేషన్, పెద్ద డేటాపై చాలా వేగంగా.","Arrays తో గణాంకాలు సిద్ధంగా వస్తాయి (<code>mean()</code>, <code>max()</code>, <code>sum()</code>). ప్రతి ఐటమ్‌ను ఒకేసారి అవును-కాదు ప్రశ్న అడిగి, ఆ జవాబుతో ఫిల్టర్ చేయొచ్చు, ఉదాహరణకు \\"ఏ innings 50 లేదా అంతకంటే ఎక్కువ?\\""],"remember":["List రిపీట్ అవుతుంది, array లెక్కిస్తుంది.","<code>arr[arr &gt;= 50]</code> సరిపోయే ఐటమ్స్‌ను మాత్రమే ఉంచుతుంది.","Arrays 2D టేబుల్స్ కావచ్చు: <code>arr.shape</code> వరుసలు, కాలమ్స్ చెబుతుంది."],"task":"మీ నగరం ఒక వారం ఉష్ణోగ్రతలను దాచి, సగటు కంటే ఎక్కువ ఉన్న రోజులను print చేయండి."},"data-pandas":{"paras":["Pandas మీకు <code>DataFrame</code> ఇస్తుంది: పేర్లున్న కాలమ్స్‌తో ఒక టేబుల్, కోడ్‌తో నడిపే Excel షీట్ లాంటిది. ఒక్క కాలమ్ అంటే <code>Series</code>.","ఎప్పుడూ ముందు ఒక చూపు చూడండి: <code>head()</code> పై వరుసలు, <code>shape</code> సైజ్, <code>describe()</code> త్వరిత గణాంకాలు చూపిస్తాయి. ఒక బ్రాకెట్ <code>df[\\"maths\\"]</code> ఒక కాలమ్ ఇస్తుంది; రెండు బ్రాకెట్లు <code>df[[\\"name\\", \\"maths\\"]]</code> చిన్న టేబుల్ ఇస్తాయి.","సాధారణ లెక్కలతో కొత్త కాలమ్స్ చేయండి, బ్రాకెట్లలో షరతుతో వరుసలను ఫిల్టర్ చేయండి, <code>sort_values()</code> తో సార్ట్ చేయండి. షరతులు కలిపేటప్పుడు <code>&amp;</code> వాడి, ప్రతి షరతును దాని సొంత బ్రాకెట్లలో పెట్టండి."],"remember":["ఒక బ్రాకెట్ = ఒక కాలమ్, రెండు బ్రాకెట్లు = ఒక టేబుల్.","ఫిల్టర్లు: <code>df[(cond1) &amp; (cond2)]</code>, ఎప్పుడూ <code>and</code> కాదు.","<code>loc</code> లేబుల్‌తో, <code>iloc</code> స్థానంతో ఎంచుకుంటాయి."],"task":"శాతం కాలమ్ (200 కి మొత్తం) కలిపి, 75% కంటే ఎక్కువ వచ్చిన విద్యార్థులను మాత్రమే చూపించండి."},"data-real":{"paras":["ఒకే లైన్, <code>pd.read_csv()</code> (లేదా <code>pd.read_excel()</code>), మొత్తం ఫైల్‌ను టేబుల్‌గా మారుస్తుంది. అక్కడి నుండి నిజమైన డబ్బు ప్రశ్నలు అడగొచ్చు: నా డబ్బు ఎక్కడికి వెళ్తోంది?","<code>groupby()</code> \\"ప్రతి కేటగిరీకి ఎంత?\\" అనే ప్రశ్నకు ఒకే లైన్‌లో జవాబిస్తుంది. <code>value_counts()</code> ఎన్నిసార్లు అని, <code>sum()</code> ఎంత అని చెబుతాయి, ఇవి తరచుగా వేర్వేరు జవాబులు ఇస్తాయి: చాయ్ తరచుగా కానీ చౌక, అద్దె అరుదుగా కానీ పెద్దది.","ఒక పెద్ద చెల్లింపు సగటును పైకి లాగినప్పుడు సగటు అబద్ధం చెప్పొచ్చు. మధ్య విలువ అయిన median తరచుగా న్యాయమైన సంఖ్య. గజిబిజి టెక్స్ట్‌ను <code>.str.strip()</code>, <code>.str.title()</code> తో శుభ్రం చేయండి, ఫలితాలను <code>to_csv()</code> తో సేవ్ చేయండి."],"remember":["<code>groupby(col)[value].sum()</code> డేటా పనిలో అత్యంత ఉపయోగకరమైన లైన్.","ఎన్నిసార్లు, ఎంత అనేవి వేర్వేరు ప్రశ్నలు.","ఒక విలువ చాలా పెద్దగా ఉన్నప్పుడు median చెక్ చేయండి."],"task":"వారంలో ఏ రోజు మీరు ఎక్కువ ఖర్చు చేస్తారో కనుక్కోండి (సూచన: <code>upi[\\"date\\"].dt.day_name()</code>)."},"data-projects":{"paras":["మూడు చిన్న ప్రాజెక్టులు అన్నింటినీ కలుపుతాయి. కాలనీ క్రికెట్ లీగ్: matches ఫైల్ నుండి ప్రతి టీమ్ గెలుపులు లెక్కించి పాయింట్స్ టేబుల్ తయారు చేయండి. నెలవారీ బడ్జెట్ చెక్: ప్రతి కేటగిరీలో మీరు ఖర్చు చేసినదాన్ని ఒక పరిమితితో పోల్చండి. పరీక్ష ఫలితాల కార్డ్: ప్రతి విద్యార్థికి మొత్తం, శాతం, గ్రేడ్.","<code>df.plot()</code> తో ఒక లైన్ చార్ట్‌తో ముగించండి, అంతే మీరు ముడి ఫైల్ నుండి జవాబుకు, జవాబు నుండి చిత్రానికి చేరుకున్నారు."],"remember":["ప్రతి ప్రాజెక్టును <code>head()</code>, <code>shape</code> తో మొదలుపెట్టండి.","చాలా జవాబులు ఒక groupby లేదా value_counts.","Kaggle లేదా Google Colab లో ప్రాక్టీస్ చేయండి, రెండూ మీ బ్రౌజర్‌లో ఉచితం."],"task":"మీ సొంత ఖర్చులను CSV లో పెట్టి, మీ టాప్ మూడు కేటగిరీలను కనుక్కోండి."}}');var fT={};fT=JSON.parse('{"intro-python":{"paras":["प्रोग्राम एक रेसिपी जैसा है: निर्देशों की एक सूची जिसे कंप्यूटर ऊपर से नीचे, एक-एक लाइन करके पूरा करता है। Python ऐसे निर्देश लिखने की भाषा है, जिसके शब्द लगभग अंग्रेज़ी जैसे पढ़े जाते हैं।","सबसे पहला निर्देश जो हर कोई सीखता है वह है <code>print</code>। ब्रैकेट के अंदर जो भी रखें, वह स्क्रीन पर दिखता है। टेक्स्ट को कोट्स के अंदर रखते हैं ताकि Python उसे बिल्कुल वैसा ही दिखाए जैसा लिखा है। कोट्स हटा दें तो Python हिसाब लगाकर जवाब दिखाता है।","जो लाइन <code>#</code> से शुरू होती है वह कमेंट है। Python उसे छोड़ देता है। कमेंट उन लोगों के लिए नोट्स हैं जो बाद में आपका कोड पढ़ेंगे, आप ख़ुद भी।"],"remember":["कोट्स का मतलब टेक्स्ट। कोट्स नहीं तो Python हिसाब लगाता है।","<code>//</code> भाग का पूरा हिस्सा देता है, <code>%</code> शेषफल देता है।","Python BODMAS मानता है: ब्रैकेट, घात, गुणा-भाग, फिर जोड़-घटाव।"],"task":"अपना नाम print करें, फिर print करें कि एक हफ़्ते में कितने मिनट होते हैं।"},"intro-variables":{"paras":["जो जवाब सिर्फ़ print होता है, वह दिखते ही चला जाता है। किसी वैल्यू को याद रखने के लिए उसे variable में रखें: एक लेबल लगा डिब्बा। नाम लेबल पर, वैल्यू डिब्बे के अंदर।","Python में <code>=</code> का मतलब \\"बराबर\\" नहीं है। इसका मतलब है \\"इसे डिब्बे में रखो\\"। इसलिए <code>score = score + 5</code> कोई असंभव गणित नहीं है: इसे दाएँ से बाएँ पढ़ें। score में जो है उसे लो, 5 जोड़ो, और नतीजा वापस score में रखो।","नामों में अक्षर, अंक और अंडरस्कोर हो सकते हैं, पर वे अंक से शुरू नहीं हो सकते और उनमें स्पेस नहीं हो सकता। Python केस सेंसिटिव है, इसलिए <code>age</code> और <code>Age</code> दो अलग डिब्बे हैं। ऐसे नाम चुनें जो बताएँ कि अंदर क्या है, जैसे <code>monthly_salary</code>।"],"remember":["एक <code>=</code> वैल्यू को variable में रखता है।","कीमत एक जगह बदलें और उसे इस्तेमाल करने वाला हर हिसाब अपने आप बदल जाता है।","<code>NameError</code> का मतलब आमतौर पर variable के नाम में टाइपो है।"],"task":"एक महीने का फ़ोन बिल, स्ट्रीमिंग सब्सक्रिप्शन और चाय का ख़र्च variables में रखें, फिर print करें कि साल भर में कितना होता है।"},"intro-types":{"paras":["Python में हर वैल्यू का एक type होता है, और type तय करता है कि आप उसके साथ क्या कर सकते हैं। पूर्ण संख्याएँ <code>int</code>, दशमलव वाली संख्याएँ <code>float</code>, टेक्स्ट <code>str</code> (string का छोटा रूप), और <code>True</code> या <code>False</code> हैं <code>bool</code>।","इसीलिए \\"10\\" + \\"5\\" का जवाब \\"105\\" आता है। कोट्स ने उन्हें टेक्स्ट बना दिया, और टेक्स्ट जोड़ने पर वह आपस में जुड़ जाता है। पहले <code>int()</code>, <code>float()</code> या <code>str()</code> से बदलें, तब गणित फिर से सही चलेगा।","किसी भी वैल्यू का type <code>type()</code> से पूछ सकते हैं। ध्यान दें कि भाग देने पर हमेशा float मिलता है, चाहे जवाब पूर्ण संख्या ही क्यों न हो।"],"remember":["कोट्स किसी भी चीज़ को टेक्स्ट बना देते हैं, संख्याओं को भी।","संख्या वाले टेक्स्ट पर गणित से पहले <code>int()</code> या <code>float()</code> लगाएँ।","<code>0.1 + 0.2</code> का थोड़ा अलग आना हर भाषा में सामान्य है। <code>round()</code> से ठीक करें।"],"task":"पहले अंदाज़ा लगाएँ कि <code>print(\\"3\\" * 3)</code> और <code>print(3 * 3)</code> क्या दिखाएँगे, फिर दोनों run करें।"},"intro-text":{"paras":["टेक्स्ट अक्षरों की एक पंक्ति है, और हर अक्षर की एक पोज़ीशन होती है। Python पोज़ीशन 0 से गिनता है, इसलिए पहला अक्षर पोज़ीशन 0 पर है। नेगेटिव पोज़ीशन आख़िर से गिनती है।","<code>name[1:3]</code> जैसा slice पोज़ीशन 1 से पोज़ीशन 3 तक (3 को छोड़कर) अक्षर लेता है। Strings के साथ <code>upper()</code>, <code>replace()</code> और <code>split()</code> जैसे तैयार टूल भी आते हैं।","किसी वाक्य में वैल्यू डालने का सबसे साफ़ तरीका f-string है। कोट्स से पहले <code>f</code> लगाएँ और variable के नाम कर्ली ब्रैकेट में लिखें।"],"remember":["गिनती 0 से शुरू होती है, 1 से नहीं।","slice में आख़िरी पोज़ीशन शामिल नहीं होती।","<code>+</code> से टेक्स्ट जोड़ने से f-strings बेहतर हैं, क्योंकि वे संख्याओं को आपके लिए बदल देती हैं।"],"task":"अपना पूरा नाम रखें और indexing से सिर्फ़ अपने initials print करें।"},"intro-input":{"paras":["<code>input()</code> प्रोग्राम को रोकता है, एक सवाल दिखाता है, और यूज़र के कुछ टाइप करके Enter दबाने का इंतज़ार करता है। वे जो भी टाइप करें, वह आपको टेक्स्ट के रूप में मिलता है।","यही बिगिनर्स का सबसे बड़ा जाल है। अगर कोई अपनी उम्र 20 टाइप करे, तो Python आपको \\"20\\" टेक्स्ट देता है, संख्या 20 नहीं। कोई भी गणित करने से पहले उसे <code>int()</code> या <code>float()</code> में डालें।"],"remember":["<code>input()</code> हमेशा टेक्स्ट ही देता है।","तुरंत बदलें: <code>int(input(...))</code>।","ब्रैकेट के अंदर का सवाल ही यूज़र को दिखता है।"],"task":"दो संख्याएँ पूछें और उनका जोड़, अंतर और गुणनफल print करें।"},"intro-bool":{"paras":["तुलना Python से हाँ-या-ना का सवाल पूछती है, और जवाब हमेशा <code>True</code> या <code>False</code> होता है। ऑपरेटर हैं <code>==</code> (बराबर), <code>!=</code> (बराबर नहीं), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code> और <code>&gt;=</code>।","फ़र्क़ देखें: एक <code>=</code> वैल्यू रखता है, दो <code>==</code> दो वैल्यू की तुलना करते हैं। इन्हें आपस में मिला देना बिगिनर्स की सबसे आम ग़लतियों में से एक है।","सवालों को जोड़ें <code>and</code> (दोनों सही होने चाहिए), <code>or</code> (कम से कम एक सही) और <code>not</code> (जवाब उलट देता है) से।"],"remember":["एक <code>=</code> रखता है, दो <code>==</code> तुलना करते हैं।","<code>and</code> को दोनों तरफ़ सही चाहिए, <code>or</code> को एक।","टेक्स्ट की तुलना केस सेंसिटिव है: <code>\\"Yes\\" == \\"yes\\"</code> False है।"],"task":"अपनी उम्र रखें और print करें कि क्या आप भारत में वोट देने के लिए काफ़ी बड़े हैं।"},"intro-if":{"paras":["<code>if</code> आपके प्रोग्राम को चुनने देता है। अगर शर्त True है, तो नीचे indent की गई लाइनें run होती हैं। नहीं तो Python उन्हें छोड़ देता है। जो कुछ भी मेल नहीं खाता, उसे <code>else</code> पकड़ता है।","जब दो से ज़्यादा रास्ते हों, तो <code>elif</code> इस्तेमाल करें। Python ऊपर से हर शर्त जाँचता है और सिर्फ़ पहली True वाली run करता है, इसलिए सबसे सख़्त जाँच पहले रखें।","Python में indentation (चार स्पेस) सजावट नहीं है। इसी से Python जानता है कि कौन-सी लाइनें if की हैं।"],"remember":["सिर्फ़ पहली True ब्रांच run होती है।","क्रम मायने रखता है: 60 से पहले 90 जाँचें।","कोलन छूट जाए या indentation ग़लत हो तो SyntaxError आता है।"],"task":"एक password checker लिखें: अगर password में 8 या ज़्यादा अक्षर हैं तो \\"Strong\\", नहीं तो \\"Too short\\" print करें।"},"intro-lists":{"paras":["list एक variable में कई वैल्यू रखती है, जिन्हें स्क्वेयर ब्रैकेट में लिखते हैं। टेक्स्ट की तरह पोज़ीशन 0 से शुरू होती हैं, और <code>-1</code> आख़िरी आइटम है।","टेक्स्ट के उलट, lists बदल सकती हैं। <code>append()</code> आख़िर में जोड़ता है, पोज़ीशन से किसी आइटम को बदल सकते हैं, और slicing से list का हिस्सा मिलता है।","Python में पूरी list पर काम करने वाले तैयार टूल हैं: <code>len()</code>, <code>sum()</code>, <code>max()</code>, <code>min()</code> और <code>sorted()</code>। ये मिलकर एक हफ़्ते की बिक्री को कुछ ही लाइनों में रिपोर्ट बना देते हैं।"],"remember":["पहला आइटम <code>[0]</code>, आख़िरी <code>[-1]</code>।","Lists बढ़ और बदल सकती हैं; टेक्स्ट नहीं।","<code>sum(x) / len(x)</code> औसत है।"],"task":"पिछले 7 दिनों के अपने स्क्रीन टाइम की list बनाएँ और कुल, सबसे ज़्यादा वाला दिन और औसत print करें।"},"intro-loops":{"paras":["loop काम को दोहराता है ताकि आपको न करना पड़े। <code>for</code> loop list के हर आइटम (या टेक्स्ट के हर अक्षर) से गुज़रता है और indent की गई लाइनें हर एक के लिए एक बार run करता है।","<code>range(1, 4)</code> संख्याएँ 1, 2 और 3 देता है। slicing की तरह आख़िरी संख्या शामिल नहीं होती। एक बहुत आम तरीका है total को 0 से शुरू करना और loop के अंदर उसमें जोड़ते जाना।","<code>while</code> loop तब तक दोहराता है जब तक शर्त True है। ध्यान रखें कि loop के अंदर कुछ बदले, वरना वह कभी नहीं रुकेगा। <code>break</code> loop से जल्दी बाहर निकलता है और <code>continue</code> अगले राउंड पर चला जाता है।"],"remember":["<code>for</code> यानी \\"हर आइटम के लिए\\", <code>while</code> यानी \\"जब तक\\"।","<code>range(a, b)</code> b से पहले रुकता है।","<code>enumerate()</code> पोज़ीशन और वैल्यू साथ में देता है।"],"task":"for loop से 7 का पहाड़ा 7 x 1 से 7 x 10 तक print करें।"},"intro-functions":{"paras":["function एक नाम वाली रेसिपी है। इसे <code>def</code> से एक बार लिखें और जितनी बार चाहें इस्तेमाल करें। इनपुट ब्रैकेट में जाते हैं (parameters) और <code>return</code> जवाब वापस भेजता है।","<code>print</code> सिर्फ़ स्क्रीन पर वैल्यू दिखाता है। <code>return</code> वैल्यू वापस देता है ताकि आप उसे रख सकें या आगे के गणित में इस्तेमाल कर सकें। ज़्यादातर functions को return करना चाहिए।","parameter की default वैल्यू हो सकती है, जो तब इस्तेमाल होती है जब आप उसे न दें। function के अंदर बने variables अंदर ही रहते हैं; बाक़ी प्रोग्राम उन्हें नहीं देख सकता।"],"remember":["<code>def</code> से एक बार लिखें, कई बार बुलाएँ।","<code>return</code> वैल्यू वापस देता है; <code>print</code> सिर्फ़ दिखाता है।","Defaults किसी argument को वैकल्पिक बना देते हैं।"],"task":"<code>celsius_to_f(c)</code> लिखें जो <code>c * 9 / 5 + 32</code> return करे, और 37 से जाँचें।"},"intro-dicts":{"paras":["dictionary जोड़े रखती है: एक key और उसकी value, जैसे शब्द और उसका अर्थ। पोज़ीशन 0 माँगने के बजाय आप नाम माँगते हैं, जैसे <code>menu[\\"chai\\"]</code>।","जो key मौजूद नहीं है उसे माँगने पर <code>KeyError</code> आता है। <code>.get()</code> सुरक्षित तरीका है: crash होने के बजाय आपकी चुनी default देता है। <code>.items()</code> से keys और values पर साथ में loop कर सकते हैं।","tuple ऐसी list है जो बदल नहीं सकती, गोल ब्रैकेट में लिखी जाती है। इसे उन वैल्यू के लिए इस्तेमाल करें जो साथ हों और न बदलें, जैसे मैप का कोऑर्डिनेट।"],"remember":["Dictionaries key से ढूँढती हैं, lists पोज़ीशन से।","जब key ग़ायब हो सकती हो तो <code>.get(key, default)</code> इस्तेमाल करें।","Tuples बनाने के बाद बदले नहीं जा सकते।"],"task":"dictionary से गिनें कि किसी वाक्य में हर शब्द कितनी बार आया।"},"intro-errors":{"paras":["Errors हार नहीं हैं। Traceback ठीक-ठीक बताता है कि क्या ग़लत हुआ और कहाँ। पहले आख़िरी लाइन पढ़ें: उसमें error का type और छोटा-सा कारण होता है।","जो सबसे ज़्यादा मिलेंगे: <code>NameError</code> (नाम में टाइपो), <code>TypeError</code> (टेक्स्ट + संख्या जैसे types मिलाना), <code>ValueError</code> (<code>int(\\"abc\\")</code>), <code>IndexError</code> (आख़िरी आइटम से आगे की पोज़ीशन) और <code>SyntaxError</code> (कोलन, ब्रैकेट या कोट छूट जाना)।","<code>try</code> और <code>except</code> आपके प्रोग्राम को crash होने के बजाय error को शांति से संभालने देते हैं। जोखिम वाली लाइन <code>try</code> में और बैकअप प्लान <code>except</code> में रखें।"],"remember":["Traceback की आख़िरी लाइन पहले पढ़ें।","हर error नहीं, एक ख़ास error type पकड़ें।","कोड के बीच में वैल्यू print करना सबसे आसान debugger है।"],"task":"input() से एक संख्या पूछें और अगर यूज़र अक्षर टाइप करे तो एक दोस्ताना संदेश print करें।"},"intro-project":{"paras":["यहाँ सब कुछ एक साथ आता है: variables स्कोर रखते हैं, dictionaries की list सवाल रखती है, loop हर सवाल पूछता है, <code>input()</code> जवाब लेता है और <code>if</code> उसे जाँचता है।","चल जाने के बाद इसे अपना बनाएँ: अपने सवाल जोड़ें, आख़िर में ग्रेड दें, या खिलाड़ी को दोबारा कोशिश करने दें।"],"remember":["पहले डेटा की योजना बनाएँ, फिर loop।","<code>.strip().lower()</code> फ़ालतू स्पेस और कैपिटल अक्षरों को माफ़ कर देता है।","एक छोटा हिस्सा बनाएँ, run करें, फिर अगला जोड़ें।"],"task":"अपने तीन सवाल जोड़ें और पूरे नंबर आने पर \\"Topper!\\" print करें।"},"data-libraries":{"paras":["library ऐसा कोड है जो किसी और ने पहले से लिखा और जाँचा है, आपके इस्तेमाल के लिए तैयार। इसे <code>import</code> से अपने प्रोग्राम में लाते हैं। Python के साथ कई आती हैं (math, random, datetime), और डेटा की दुनिया दो और पर चलती है: संख्याओं पर तेज़ गणित के लिए NumPy और टेबल के लिए Pandas।","चलन के मुताबिक़ NumPy को <code>np</code> और Pandas को <code>pd</code> के नाम से import करते हैं। Google Colab और Kaggle notebooks में दोनों पहले से इंस्टॉल हैं; अपने कंप्यूटर पर इन्हें एक बार <code>pip install numpy pandas</code> से इंस्टॉल करते हैं।"],"remember":["फ़ाइल में सबसे ऊपर एक बार <code>import</code> करें।","<code>np</code> और <code>pd</code> वो नाम हैं जो सब इस्तेमाल करते हैं।","Colab और Kaggle में इंस्टॉल करने की ज़रूरत नहीं।"],"task":"random को import करें और 5 बार पासा फेंकने का simulation करें।"},"data-files":{"paras":["प्रोग्राम ख़त्म होते ही variables ग़ायब हो जाते हैं। फ़ाइलें बची रहती हैं। <code>open()</code> में <code>\\"w\\"</code> नई फ़ाइल लिखता है, <code>\\"a\\"</code> आख़िर में जोड़ता है, और कोई मोड न हो तो पढ़ता है।","<code>w</code> का जाल: किसी मौजूदा फ़ाइल को <code>\\"w\\"</code> से खोलने पर लिखने से पहले ही वह ख़ाली हो जाती है। जो है उसे रखना हो तो <code>\\"a\\"</code> इस्तेमाल करें।","<code>with open(...) as f:</code> ब्लॉक ख़त्म होने पर फ़ाइल को आपके लिए बंद कर देता है। CSV (comma-separated values) वह सादा टेक्स्ट फ़ॉर्मेट है जिसमें लगभग सारा डेटा आता है: हर लाइन में एक पंक्ति, कॉलम कॉमा से अलग।"],"remember":["<code>\\"w\\"</code> पुराना मिटा देता है, <code>\\"a\\"</code> जोड़ता है।","हमेशा <code>with</code> इस्तेमाल करें ताकि फ़ाइल बंद हो।","CSV बस कॉमा वाला टेक्स्ट है।"],"task":"एक चाय काउंटर लिखें जो आज के कप फ़ाइल में जोड़े और अब तक का कुल print करे।"},"data-numpy":{"paras":["Python list को 2 से गुणा करें तो list दोहराई जाती है। NumPy array को 2 से गुणा करें तो हर संख्या दुगनी हो जाती है। पूरा विचार यही है: बिना loop के हर आइटम पर एक साथ एक ऑपरेशन, और बड़े डेटा पर बहुत तेज़।","Arrays के साथ आँकड़े तैयार आते हैं (<code>mean()</code>, <code>max()</code>, <code>sum()</code>)। आप हर आइटम से एक साथ हाँ-या-ना का सवाल पूछ सकते हैं और उस जवाब से फ़िल्टर कर सकते हैं, जैसे \\"कौन-सी innings 50 या ज़्यादा थीं?\\""],"remember":["List दोहराती है, array हिसाब लगाता है।","<code>arr[arr &gt;= 50]</code> सिर्फ़ मेल खाने वाले आइटम रखता है।","Arrays 2D टेबल हो सकते हैं: <code>arr.shape</code> पंक्तियाँ और कॉलम बताता है।"],"task":"अपने शहर का एक हफ़्ते का तापमान रखें और औसत से ऊपर वाले दिन print करें।"},"data-pandas":{"paras":["Pandas आपको <code>DataFrame</code> देता है: नाम वाले कॉलम के साथ एक टेबल, जैसे Excel शीट जिसे आप कोड से चलाते हैं। एक अकेला कॉलम <code>Series</code> है।","हमेशा पहले एक नज़र डालें: <code>head()</code> ऊपर की पंक्तियाँ, <code>shape</code> साइज़ और <code>describe()</code> झटपट आँकड़े दिखाता है। एक ब्रैकेट <code>df[\\"maths\\"]</code> एक कॉलम देता है; दो ब्रैकेट <code>df[[\\"name\\", \\"maths\\"]]</code> छोटी टेबल देते हैं।","सादे गणित से नए कॉलम बनाएँ, ब्रैकेट में शर्त से पंक्तियाँ फ़िल्टर करें, और <code>sort_values()</code> से क्रम में लगाएँ। शर्तें जोड़ते समय <code>&amp;</code> इस्तेमाल करें और हर शर्त को अपने ब्रैकेट में रखें।"],"remember":["एक ब्रैकेट = एक कॉलम, दो ब्रैकेट = एक टेबल।","फ़िल्टर: <code>df[(cond1) &amp; (cond2)]</code>, कभी <code>and</code> नहीं।","<code>loc</code> लेबल से, <code>iloc</code> पोज़ीशन से चुनता है।"],"task":"प्रतिशत का कॉलम (200 में से कुल) जोड़ें और सिर्फ़ 75% से ऊपर वाले छात्र दिखाएँ।"},"data-real":{"paras":["एक लाइन, <code>pd.read_csv()</code> (या <code>pd.read_excel()</code>), पूरी फ़ाइल को टेबल बना देती है। वहाँ से आप असली पैसों के सवाल पूछ सकते हैं: मेरा पैसा कहाँ जाता है?","<code>groupby()</code> \\"हर कैटेगरी में कितना?\\" का जवाब एक लाइन में देता है। <code>value_counts()</code> बताता है कितनी बार, <code>sum()</code> बताता है कितना, और ये अक्सर अलग जवाब देते हैं: चाय बार-बार पर सस्ती, किराया कभी-कभार पर भारी।","जब एक बड़ा भुगतान औसत को ऊपर खींच ले, तो औसत झूठ बोल सकता है। median, यानी बीच की वैल्यू, अक्सर ज़्यादा सही संख्या होती है। बिखरे टेक्स्ट को <code>.str.strip()</code> और <code>.str.title()</code> से साफ़ करें, और नतीजे <code>to_csv()</code> से सेव करें।"],"remember":["<code>groupby(col)[value].sum()</code> डेटा के काम की सबसे काम की लाइन है।","कितनी बार और कितना, ये अलग सवाल हैं।","जब कोई एक वैल्यू बहुत बड़ी हो तो median देखें।"],"task":"पता करें कि हफ़्ते के किस दिन आप सबसे ज़्यादा ख़र्च करते हैं (संकेत: <code>upi[\\"date\\"].dt.day_name()</code>)।"},"data-projects":{"paras":["तीन छोटे प्रोजेक्ट सब कुछ जोड़ते हैं। कॉलोनी क्रिकेट लीग: matches फ़ाइल से हर टीम की जीत गिनें और पॉइंट्स टेबल बनाएँ। महीने के बजट की जाँच: हर कैटेगरी में जो ख़र्च किया उसकी एक सीमा से तुलना करें। परीक्षा का रिज़ल्ट कार्ड: हर छात्र का कुल, प्रतिशत और ग्रेड।","<code>df.plot()</code> से एक लाइन चार्ट बनाकर ख़त्म करें, और आप कच्ची फ़ाइल से जवाब तक और जवाब से तस्वीर तक पहुँच गए।"],"remember":["हर प्रोजेक्ट <code>head()</code> और <code>shape</code> से शुरू करें।","ज़्यादातर जवाब एक groupby या value_counts हैं।","Kaggle या Google Colab पर प्रैक्टिस करें, दोनों आपके ब्राउज़र में मुफ़्त हैं।"],"task":"अपने ख़र्चे एक CSV में डालें और अपनी टॉप तीन कैटेगरी पता करें।"}}');let fP=[["en","EN","English"],["te","తెలుగు","Telugu"],["hi","हिंदी","Hindi"]],fA={te:s(fj),hi:s(fT)};function f_(){let e;return nQ(),"te"===(e=nH(nq).v)||"hi"===e?e:"en"}let fM={en:{remember:"Remember",try:"Try it yourself.",tryHint:"Type it into the code box and press Run.",note:""},te:{remember:"గుర్తుంచుకోండి",try:"మీరే ప్రయత్నించండి.",tryHint:"కోడ్ బాక్స్‌లో టైప్ చేసి Run నొక్కండి.",note:"వివరణ తెలుగులో. కోడ్, క్విజ్‌లు ఇంగ్లీష్‌లోనే ఉంటాయి."},hi:{remember:"याद रखें",try:"ख़ुद करके देखें।",tryHint:"कोड बॉक्स में टाइप करें और Run दबाएँ।",note:"व्याख्या हिंदी में। कोड और क्विज़ अंग्रेज़ी में ही रहेंगे।"}};var S=x("6ccxb");let fR=S.forwardRef(({className:e,children:t,...n},r)=>(0,k.jsxs)(d0,{children:[(0,k.jsx)(d2,{className:"fixed inset-0 z-50 bg-black/50 data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0"}),(0,k.jsxs)(d6,{ref:r,className:tk("fixed inset-y-0 right-0 z-50 flex h-full w-4/5 max-w-sm flex-col gap-4 border-l bg-background

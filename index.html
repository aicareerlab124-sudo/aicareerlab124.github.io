<style>
/* Layout: sticky nav bar, then home / course / about views. Courses: masthead with two course tabs, then a sticky topic index beside lesson cards (text left, video slot right). */
:root {
  --bg: #f5f6fb; --surface: #ffffff; --ink: #0b1530; --muted: #4d5775; --line: #dde1ee;
  --navy: #0b1530; --navy-2: #16234a; --on-navy: #ffffff;
  --accent: #ffd23f; --on-accent: #0b1530; --hot: #e2364a; --ok: #2f7d12;
  --code-bg: #0b1530; --code-ink: #e8ecf8; --code-out: #c6ff3d;
  --display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1530; --surface: #111d40; --ink: #eef1fa; --muted: #a6b0cf; --line: #24315c;
  --navy: #070e22; --navy-2: #1a2852; --on-navy: #ffffff;
  --accent: #ffd23f; --on-accent: #0b1530; --hot: #ff5d6c; --ok: #c6ff3d;
  --code-bg: #070e22; --code-ink: #e8ecf8; --code-out: #c6ff3d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1530; --surface: #111d40; --ink: #eef1fa; --muted: #a6b0cf; --line: #24315c;
  --navy: #070e22; --navy-2: #1a2852; --on-navy: #ffffff;
  --accent: #ffd23f; --on-accent: #0b1530; --hot: #ff5d6c; --ok: #c6ff3d;
  --code-bg: #070e22; --code-ink: #e8ecf8; --code-out: #c6ff3d; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, var(--accent) 22%, transparent); padding: .05em .3em; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
/* masthead */
.mast { background: var(--navy); color: var(--on-navy); }
.mast .wrap { padding-block: 28px 0; display: flex; flex-direction: column; gap: 22px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: -.01em; font-size: 1.05rem; }
.logo { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: .95rem; }
.yt { display: inline-flex; align-items: center; gap: 8px; color: var(--on-navy); text-decoration: none; font-weight: 600; font-size: .9rem; border: 1px solid rgba(255,255,255,.25); padding: 8px 14px; border-radius: 999px; }
.yt:hover, .yt:focus-visible { background: rgba(255,255,255,.1); }
.yt svg { width: 18px; height: 18px; fill: #ff3b3b; }
.hero h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2rem, 5.4vw, 3.6rem); line-height: 1.02; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 10px 0 0; color: #c3cbe6; max-width: 60ch; }
.tabs { display: flex; gap: 6px; margin-top: 4px; overflow-x: auto; }
.tab { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 1rem; padding: 14px 20px 13px; border-radius: 12px 12px 0 0; background: var(--navy-2); color: #c3cbe6; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; text-decoration: none; }
.tab small { font-family: var(--mono); font-weight: 400; font-size: .75rem; opacity: .8; }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
/* course intro */
.intro { padding-block: 40px 8px; }
.eyebrow { color: var(--hot); font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
.intro h2 { font-family: var(--display); font-weight: 900; font-size: clamp(1.7rem, 3.6vw, 2.4rem); letter-spacing: -.03em; line-height: 1.1; margin: 0; }
.lede { color: var(--muted); max-width: 64ch; margin: 10px 0 0; font-size: 1.05rem; }
.facts { display: flex; gap: 8px 28px; flex-wrap: wrap; margin-top: 20px; }
.facts div { display: flex; align-items: baseline; gap: 8px; }
.facts b { font-family: var(--display); font-weight: 900; font-size: 1.6rem; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.facts span { color: var(--muted); font-size: .9rem; }
/* layout */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-block: 24px 64px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc button { all: unset; cursor: pointer; display: flex; gap: 10px; width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: 8px; font-size: .92rem; color: var(--muted); }
.toc button span { font-family: var(--mono); font-size: .78rem; padding-top: 2px; }
.toc button:hover { color: var(--ink); background: var(--surface); }
.toc button:focus-visible { outline: 2px solid var(--accent); }
.toc button.on { color: var(--ink); background: var(--surface); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.topics { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
/* topic */
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; scroll-margin-top: 16px; }
.topic-head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.num { font-family: var(--mono); font-weight: 600; font-size: .95rem; background: var(--navy); color: var(--accent); border-radius: 10px; width: 46px; height: 46px; display: grid; place-items: center; flex: none; }
.topic h3 { font-family: var(--display); font-weight: 900; font-size: 1.55rem; letter-spacing: -.025em; line-height: 1.15; margin: 0; }
.tag { margin: 2px 0 0; color: var(--muted); font-family: var(--mono); font-size: .8rem; }
.topic-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
.lesson { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

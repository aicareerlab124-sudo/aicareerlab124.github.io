t on the screen. The quotes tell Python this is text, so it prints it exactly as written."},{"code":"print(7 + 3)","text":"No quotes, so Python does the maths first and prints the answer, 10."},{"code":"print(7 / 2)","text":"A single slash is normal division. It gives 3.5, a number with a decimal point."},{"code":"print(2 ** 3)","text":"Two stars means power: 2 multiplied by itself 3 times, which is 8. The text after # is a comment, and Python ignores it."},{"code":"print(17 // 5)","text":"Double slash divides and throws away the remainder. 5 goes into 17 three whole times, so the answer is 3."},{"code":"print(17 % 5)","text":"The percent sign keeps only the remainder. 17 is 15 + 2, so it prints 2. Useful to check if a number is even."},{"code":"print((2 + 3) * 4)","text":"Brackets are worked out first, so 2 + 3 becomes 5, then 5 × 4 gives 20. Without brackets it would be 14."}],"remember":["Quotes mean text. No quotes means Python calculates.","<code>//</code> keeps the whole part of a division, <code>%</code> keeps the remainder.","Python follows BODMAS: brackets, powers, multiply and divide, then add and subtract."],"task":"Print your name, then print how many minutes are in a week.","video":{"start":56}},{"id":"intro-variables","num":"02","title":"Variables","tag":"boxes that remember","paras":["An answer that is only printed is gone the moment it appears. To remember a value, put it in a variable: a labelled box. The name goes on the label and the value goes inside.","In Python, <code>=</code> does not mean \\"equals\\". It means \\"put this in the box\\". So <code>score = score + 5</code> is not impossible maths: read it right to left. Take what is in score, add 5, and put the result back in score.","Names can use letters, numbers and underscores, cannot start with a number and cannot contain spaces. Python is case sensitive, so <code>age</code> and <code>Age</code> are two different boxes. Pick names that say what is inside, like <code>monthly_salary</code>."],"code":"price = 250\\nquantity = 3\\ndiscount = 100\\n\\ntotal = price * quantity - discount\\nprint(total)\\n\\nscore = 10\\nscore = score + 5\\nscore += 5          # shortcut for the line above\\nprint(score)","inputs":null,"output":"650\\n20","explain":[{"code":"price = 250","text":"Creates a box called price and puts 250 inside. The = means store, not equals."},{"code":"quantity = 3\\ndiscount = 100","text":"Two more boxes, each with a clear name, so anyone reading knows what the numbers mean."},{"code":"total = price * quantity - discount","text":"Python opens the boxes, works out 250 × 3 − 100 = 650, and stores the answer in a new box called total."},{"code":"print(total)","text":"Shows what is inside total: 650."},{"code":"score = 10\\nscore = score + 5","text":"Read the second line right to left: take what is in score (10), add 5, and put 15 back into score."},{"code":"score += 5","text":"A shortcut that means exactly the same as score = score + 5. Now score holds 20."}],"remember":["One <code>=</code> stores a value in a variable.","Change the price in one place and every calculation that uses it updates.","A <code>NameError</code> usually means a typo in a variable name."],"task":"Store your phone bill, streaming subscriptions and chai spending for one month, then print what they cost in a year.","video":{"start":363}},{"id":"intro-types","num":"03","title":"Data types","tag":"int, float, str, bool","paras":["Every value in Python has a type, and the type decides what you can do with it. Whole numbers are <code>int</code>, numbers with a decimal point are <code>float</code>, text is <code>str</code> (short for string), and <code>True</code> or <code>False</code> is <code>bool</code>.","This is why \\"10\\" + \\"5\\" gives \\"105\\". The quotes made them text, and adding text joins it together. Convert first with <code>int()</code>, <code>float()</code> or <code>str()</code> and the maths works again.","Ask Python for any value\'s type with <code>type()</code>. Notice that dividing always gives a float, even when the answer is a whole number."],"code":"print(type(5))\\nprint(type(3.14))\\nprint(type(\\"hello\\"))\\nprint(type(True))\\n\\nprint(\\"10\\" + \\"5\\")\\nprint(int(\\"10\\") + int(\\"5\\"))\\nprint(10 / 2)\\nprint(0.1 + 0.2)   # floats are tiny approximations","inputs":null,"output":"<class \'int\'>\\n<class \'float\'>\\n<class \'str\'>\\n<class \'bool\'>\\n105\\n15\\n5.0\\n0.30000000000000004","explain":[{"code":"print(type(5))","text":"type() tells you what kind of value something is. 5 is a whole number, so it is an int."},{"code":"print(type(3.14))","text":"It has a decimal point, so it is a float."},{"code":"print(type(\\"hello\\"))","text":"Anything inside quotes is text, which Python calls a str (string)."},{"code":"print(type(True))","text":"True and False are their own type, bool, used for yes-or-no answers."},{"code":"print(\\"10\\" + \\"5\\")","text":"Both are text because of the quotes, and + on text glues them together. That is why you get 105."},{"code":"print(int(\\"10\\") + int(\\"5\\"))","text":"int() turns the text into real numbers first, so now + does maths and gives 15."},{"code":"print(10 / 2)","text":"Division always gives a float, so even a whole answer prints as 5.0."},{"code":"print(0.1 + 0.2)","text":"Computers store decimals as tiny approximations, so the answer is a hair off 0.3. Use round() when you show money."}],"remember":["Quotes turn anything into text, even numbers.","Use <code>int()</code> or <code>float()</code> before doing maths on text that holds a number.","<code>0.1 + 0.2</code> being slightly off is normal in every language. Use <code>round()</code> to tidy it."],"task":"Predict the output of <code>print(\\"3\\" * 3)</code> and <code>print(3 * 3)</code>, then run both.","video":{"start":654}},{"id":"intro-text","num":"04","title":"Working with text","tag":"f-strings, indexing, slicing","paras":["Text is a row of characters, and each one has a position. Python counts positions from 0, so the first letter is at position 0. A negative position counts from the end.","A slice like <code>name[1:3]</code> takes characters from position 1 up to, but not including, position 3. Strings also come with built-in tools such as <code>upper()</code>, <code>replace()</code> and <code>split()</code>.","An f-string is the cleanest way to put values inside a sentence. Put an <code>f</code> before the quotes and write variable names inside curly brackets."],"code":"name = \\"Priya\\"\\ncity = \\"Pune\\"\\nprint(f\\"{name} lives in {city}\\")\\nprint(len(name))\\nprint(name[0])\\nprint(name[-1])\\nprint(name[1:3])\\nprint(name.upper())\\nprint(\\"chai,samosa,vada pav\\".split(\\",\\"))","inputs":null,"output":"Priya lives in Pune\\n5\\nP\\na\\nri\\nPRIYA\\n[\'chai\', \'samosa\', \'vada pav\']","explain":[{"code":"name = \\"Priya\\"\\ncity = \\"Pune\\"","text":"Two text variables we will use below."},{"code":"print(f\\"{name} lives in {city}\\")","text":"The f before the quotes makes it an f-string. Python swaps {name} and {city} for their values."},{"code":"print(len(name))","text":"len() counts the characters. Priya has 5 letters."},{"code":"print(name[0])","text":"Square brackets pick one character by position. Counting starts at 0, so [0] is the first letter, P."},{"code":"print(name[-1])","text":"Negative positions count from the end. [-1] is always the last character, a."},{"code":"print(name[1:3])","text":"A slice: from position 1 up to, but not including, 3. That gives the letters at 1 and 2, ri."},{"code":"print(name.upper())","text":"upper() returns a capital-letter copy. The original name is not changed."},{"code":"print(\\"chai,samosa,vada pav\\".split(\\",\\"))","text":"split() cuts the text wherever it finds a comma and gives back a list of the pieces."}],"remember":["Counting starts at 0, not 1.","In a slice the end position is not included.","f-strings beat joining text with <code>+</code> because they convert numbers for you."],"task":"Store your full name and print only your initials using indexing.","video":{"start":902}},{"id":"intro-input","num":"05","title":"Talking to your program","tag":"input()","paras":["<code>input()</code> pauses the program, shows a question, and waits for the user to type something and press Enter. Whatever they type comes back to you as text.","That is the classic beginner trap. If someone types 20 for their age, Python hands you the text \\"20\\", not the number 20. Wrap it in <code>int()</code> or <code>float()</code> before doing any maths."],"code":"bill = float(input(\\"Bill amount: \\"))\\ntip_percent = int(input(\\"Tip %: \\"))\\n\\ntip = bill * tip_percent / 100\\nprint(f\\"Tip: Rs {tip}\\")\\nprint(f\\"Total: Rs {bill + tip}\\")","inputs":"850\\n10","output":"Bill amount: 850\\nTip %: 10\\nTip: Rs 85.0\\nTotal: Rs 935.0","explain":[{"code":"bill = float(input(\\"Bill amount: \\"))","text":"input() shows the question and waits for the user. What they type comes back as text, so float() turns it into a number with decimals."},{"code":"tip_percent = int(input(\\"Tip %: \\"))","text":"Same idea, but int() because a tip percent is a whole number."},{"code":"tip = bill * tip_percent / 100","text":"Works out the percentage: 850 × 10 ÷ 100 = 85.0."},{"code":"print(f\\"Tip: Rs {tip}\\")","text":"An f-string puts the tip inside the sentence."},{"code":"print(f\\"Total: Rs {bill + tip}\\")","text":"You can even do maths inside the curly brackets. 850 + 85 = 935."}],"remember":["<code>input()</code> always returns text.","Convert right away: <code>int(input(...))</code>.","The question inside the brackets is what the user sees."],"task":"Ask for two numbers and print their sum, difference and product.","video":{"start":1227}},{"id":"intro-bool","num":"06","title":"True or False","tag":"comparisons, and, or, not","paras":["A comparison asks Python a yes-or-no question and the answer is always <code>True</code> or <code>False</code>. The operators are <code>==</code> (equal), <code>!=</code> (not equal), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code> and <code>&gt;=</code>.","Watch the difference: one <code>=</code> stores a value, two <code>==</code> compares two values. Mixing them up is one of the most common beginner errors.","Combine questions with <code>and</code> (both must be true), <code>or</code> (at least one is true) and <code>not</code> (flips the answer)."],"code":"marks = 72\\nprint(marks >= 35)\\nprint(marks == 100)\\nprint(marks != 100)\\nprint(marks > 60 and marks < 80)\\nprint(marks < 35 or marks > 90)\\nprint(not marks >= 35)\\nprint(30 < marks < 80)   # chained comparison","inputs":null,"output":"True\\nFalse\\nTrue\\nTrue\\nFalse\\nFalse\\nTrue","explain":[{"code":"marks = 72","text":"The value we will ask questions about."},{"code":"print(marks >= 35)","text":"Is 72 greater than or equal to 35? Yes, so True."},{"code":"print(marks == 100)","text":"Two equals signs compare. 72 is not 100, so False."},{"code":"print(marks != 100)","text":"!= means not equal. 72 is not 100, so True."},{"code":"print(marks > 60 and marks < 80)","text":"and needs both sides to be True. 72 is above 60 and below 80, so True."},{"code":"print(marks < 35 or marks > 90)","text":"or needs at least one side to be True. Neither is, so False."},{"code":"print(not marks >= 35)","text":"not flips the answer. marks >= 35 is True, so not makes it False."},{"code":"print(30 < marks < 80)","text":"Python lets you chain comparisons like in maths: is 72 between 30 and 80? True."}],"remember":["One <code>=</code> stores, two <code>==</code> compares.","<code>and</code> needs both sides true, <code>or</code> needs one.","Text comparisons are case sensitive: <code>\\"Yes\\" == \\"yes\\"</code> is False."],"task":"Store your age and print whether you are old enough to vote in India.","video":{"start":1360}},{"id":"intro-if","num":"07","title":"Decisions with if","tag":"if, elif, else","paras":["<code>if</code> lets your program choose. If the condition is True, the indented lines underneath run. If not, Python skips them. <code>else</code> catches everything that did not match.","When there are more than two roads, use <code>elif</code>. Python checks each condition from the top and runs only the first one that is True, so put the strictest check first.","Indentation (four spaces) is not decoration in Python. It is how Python knows which lines belong to the if."],"code":"marks = 72\\n\\nif marks >= 90:\\n    print(\\"Grade A\\")\\nelif marks >= 60:\\n    print(\\"Grade B\\")\\nelif marks >= 35:\\n    print(\\"Grade C\\")\\nelse:\\n    print(\\"Keep practising\\")\\n\\nnumber = 7\\nif number % 2 == 0:\\n    print(\\"even\\")\\nelse:\\n    print(\\"odd\\")","inputs":null,"output":"Grade B\\nodd","explain":[{"code":"if marks >= 90:","text":"Asks the first question. It ends with a colon, and the indented line below only runs if the answer is True. 72 is not 90 or more, so Python skips it."},{"code":"elif marks >= 60:","text":"elif means else if. Python checks this only because the first one was False. 72 is 60 or more, so this branch runs and prints Grade B."},{"code":"elif marks >= 35:","text":"Skipped. Once one branch has run, Python ignores the rest of the chain."},{"code":"else:","text":"Catches anything that matched none of the questions above."},{"code":"if number % 2 == 0:","text":"% 2 gives the remainder after dividing by 2. If it is 0 the number is even. 7 leaves 1, so the else runs and prints odd."}],"remember":["Only the first True branch runs.","Order matters: check 90 before 60.","A missing colon or wrong indentation is a SyntaxError."],"task":"Write a password checker: print \\"Strong\\" if the password has 8 or more characters, otherwise \\"Too short\\".","video":{"start":1546}},{"id":"intro-lists","num":"08","title":"Lists","tag":"many values in one box","paras":["A list holds many values in one variable, written inside square brackets. Positions start at 0, exactly like text, and <code>-1</code> is the last item.","Unlike text, lists can change. <code>append()</code> adds to the end, you can replace an item by its position, and slicing gives you part of the list.","Python has built-ins that work on whole lists: <code>len()</code>, <code>sum()</code>, <code>max()</code>, <code>min()</code> and <code>sorted()</code>. Together they turn a week of sales into a report in a few lines."],"code":"sales = [120, 95, 140, 80, 160]\\nprint(sales[0])\\nprint(sales[-1])\\nprint(sales[1:3])\\n\\nsales.append(110)\\nsales[1] = 100\\nprint(sales)\\n\\nprint(\\"Total:\\", sum(sales))\\nprint(\\"Best day:\\", max(sales))\\nprint(\\"Average:\\", round(sum(sales) / len(sales), 1))","inputs":null,"output":"120\\n160\\n[95, 140]\\n[120, 100, 140, 80, 160, 110]\\nTotal: 710\\nBest day: 160\\nAverage: 118.3","explain":[{"code":"sales = [120, 95, 140, 80, 160]","text":"One variable holding five values, inside square brackets, separated by commas."},{"code":"print(sales[0])","text":"Position 0 is the first item: 120."},{"code":"print(sales[-1])","text":"Position -1 is the last item: 160."},{"code":"print(sales[1:3])","text":"A slice gives a smaller list: positions 1 and 2, so [95, 140]."},{"code":"sales.append(110)","text":"append() adds a new item to the end. The list now has 6 values."},{"code":"sales[1] = 100","text":"Lists can change. This replaces the item at position 1 (95) with 100."},{"code":"print(\\"Total:\\", sum(sales))","text":"sum() adds every number in the list."},{"code":"print(\\"Best day:\\", max(sales))","text":"max() finds the biggest value."},{"code":"print(\\"Average:\\", round(sum(sales) / len(sales), 1))","text":"Total divided by how many items is the average. round(..., 1) keeps one decimal place."}],"remember":["First item is <code>[0]</code>, last is <code>[-1]</code>.","Lists can grow and change; text cannot.","<code>sum(x) / len(x)</code> is the average."],"task":"Make a list of your last 7 days of screen time and print the total, the highest day and the average.","video":{"start":1858}},{"id":"intro-loops","num":"09","title":"Loops","tag":"for, range, while","paras":["A loop repeats work so you don\'t have to. A <code>for</code> loop goes through every item in a list (or every letter in text) and runs the indented lines once for each.","<code>range(1, 4)</code> gives the numbers 1, 2 and 3. The end number is not included, just like slicing. A very common pattern is to start a total at 0 and add to it inside the loop.","A <code>while</code> loop repeats as long as a condition is True. Make sure something inside the loop changes, or it never stops. <code>break</code> leaves a loop early and <code>continue</code> skips to the next round."],"code":"for lap in range(1, 4):\\n    print(\\"Lap\\", lap)\\n\\ntotal = 0\\nfor amount in [250, 120, 80]:\\n    total += amount\\nprint(\\"Spent:\\", total)\\n\\ncountdown = 3\\nwhile countdown > 0:\\n    print(countdown)\\n    countdown -= 1\\nprint(\\"Go!\\")","inputs":null,"output":"Lap 1\\nLap 2\\nLap 3\\nSpent: 450\\n3\\n2\\n1\\nGo!","explain":[{"code":"for lap in range(1, 4):","text":"range(1, 4) makes the numbers 1, 2, 3 (the 4 is not included). Each time round, lap holds the next number."},{"code":"    print(\\"Lap\\", lap)","text":"The indented line is the loop\'s body. It runs once for every number."},{"code":"total = 0","text":"Start a running total at zero before the loop."},{"code":"for amount in [250, 120, 80]:\\n    total += amount","text":"Goes through each amount and adds it to total: 0 + 250 + 120 + 80 = 450."},{"code":"while countdown > 0:","text":"A while loop keeps going as long as the condition is True."},{"code":"    countdown -= 1","text":"Takes 1 away each time. Without this line countdown would stay at 3 and the loop would never stop."},{"code":"print(\\"Go!\\")","text":"Not indented, so it runs once, after the loop has finished."}],"remember":["<code>for</code> is for \\"each item\\", <code>while</code> is for \\"until\\".","<code>range(a, b)</code> stops before b.","<code>enumerate()</code> gives you the position and the value together."],"task":"Print the 7 times table from 7 x 1 to 7 x 10 with a for loop.","video":{"start":2085}},{"id":"intro-functions","num":"10","title":"Functions","tag":"def, parameters, return","paras":["A function is a recipe with a name. You write it once with <code>def</code> and use it as many times as you like. Inputs go in the brackets (parameters) and <code>return</code> sends the answer back.","<code>print</code> only shows a value on screen. <code>return</code> hands the value back so you can store it or use it in more maths. Most functions should return.","A parameter can have a default value that is used when you leave it out. Variables created inside a function stay inside it; the rest of the program cannot see them."],"code":"def add_gst(price, rate=18):\\n    return price + price * rate / 100\\n\\nprint(add_gst(1000))\\nprint(add_gst(1000, 5))\\n\\ndef take_home(salary, tax_percent):\\n    tax = salary * tax_percent / 100\\n    return salary - tax\\n\\npay = take_home(50000, 10)\\nprint(f\\"Take home: Rs {pay}\\")","inputs":null,"output":"1180.0\\n1050.0\\nTake home: Rs 45000.0","explain":[{"code":"def add_gst(price, rate=18):","text":"def creates a function called add_gst. It takes a price and a rate. rate=18 is a default, used when you don\'t give one."},{"code":"    return price + price * rate / 100","text":"Works out the price plus GST and sends the answer back to whoever called the function."},{"code":"print(add_gst(1000))","text":"Calls the function with only a price, so rate uses the default 18. 1000 + 180 = 1180.0."},{"code":"print(add_gst(1000, 5))","text":"This time we pass 5, which replaces the default. 1000 + 50 = 1050.0."},{"code":"def take_home(salary, tax_percent):","text":"A second function with two inputs."},{"code":"    tax = salary * tax_percent / 100","text":"tax only exists inside the function. The rest of the program cannot see it."},{"code":"pay = take_home(50000, 10)","text":"The returned value, 45000.0, is stored in pay so we can use it later."}],"remember":["Write it once with <code>def</code>, call it many times.","<code>return</code> gives a value back; <code>print</code> only shows it.","Defaults make an argument optional."],"task":"Write <code>celsius_to_f(c)</code> that returns <code>c * 9 / 5 + 32</code> and test it with 37.","video":{"start":2525}},{"id":"intro-dicts","num":"11","title":"Dictionaries and tuples","tag":"look things up by name","paras":["A dictionary stores pairs: a key and its value, like a word and its meaning. Instead of asking for position 0, you ask for a name, such as <code>menu[\\"chai\\"]</code>.","Asking for a key that is not there causes a <code>KeyError</code>. <code>.get()</code> is the safe way: it returns a default you choose instead of crashing. <code>.items()</code> lets you loop through keys and values together.","A tuple is a list that cannot change, written with round brackets. Use it for values that belong together and should stay fixed, like a map coordinate."],"code":"menu = {\\"chai\\": 15, \\"samosa\\": 20, \\"vada pav\\": 25}\\nprint(menu[\\"chai\\"])\\nprint(menu.get(\\"dosa\\", \\"not on the menu\\"))\\n\\nmenu[\\"dosa\\"] = 60\\nfor item, price in menu.items():\\n    print(item, \\"Rs\\", price)\\n\\nhyderabad = (17.38, 78.48)\\nprint(hyderabad[0])","inputs":null,"output":"15\\nnot on the menu\\nchai Rs 15\\nsamosa Rs 20\\nvada pav Rs 25\\ndosa Rs 60\\n17.38","explain":[{"code":"menu = {\\"chai\\": 15, \\"samosa\\": 20, \\"vada pav\\": 25}","text":"A dictionary in curly brackets. Each item is a key, a colon, then its value."},{"code":"print(menu[\\"chai\\"])","text":"Look up by name instead of position. The value for chai is 15."},{"code":"print(menu.get(\\"dosa\\", \\"not on the menu\\"))","text":"dosa is not a key yet. menu[\\"dosa\\"] would crash with KeyError, but .get() returns the default you gave instead."},{"code":"menu[\\"dosa\\"] = 60","text":"Assigning to a new key adds it to the dictionary."},{"code":"for item, price in menu.items():","text":".items() gives each key and value together, so the loop can print both."},{"code":"hyderabad = (17.38, 78.48)","text":"A tuple uses round brackets. Like a list, but it cannot be changed after you create it."},{"code":"print(hyderabad[0])","text":"Tuples use positions just like lists. [0] is the latitude."}],"remember":["Dictionaries look up by key, lists by position.","Use <code>.get(key, default)</code> when a key might be missing.","Tuples cannot be changed after you create them."],"task":"Count how many times each word appears in a sentence using a dictionary.","video":{"start":2878}},{"id":"intro-errors","num":"12","title":"When things go wrong","tag":"tracebacks, try and except","paras":["Errors are not failure. A traceback tells you exactly what went wrong and where. Read the last line first: it names the error type and gives a short reason.","The ones you will meet most are <code>NameError</code> (typo in a name), <code>TypeError</code> (mixing types like text + number), <code>ValueError</code> (<code>int(\\"abc\\")</code>), <code>IndexError</code> (position past the end) and <code>SyntaxError</code> (missing colon, bracket or quote).","<code>try</code> and <code>except</code> let your program handle an error calmly instead of crashing. Put the risky line in <code>try</code> and the backup plan in <code>except</code>."],"code":"try:\\n    age = int(\\"twenty\\")\\nexcept ValueError:\\n    print(\\"Please type your age as a number\\")\\n\\nmarks = [80, 92, 75]\\ntry:\\n    print(marks[3])\\nexcept IndexError:\\n    print(\\"There are only\\", len(marks), \\"marks\\")","inputs":null,"output":"Please type your age as a number\\nThere are only 3 marks","explain":[{"code":"try:","text":"Python tries the indented lines below. If one causes an error, it jumps to the matching except instead of crashing."},{"code":"    age = int(\\"twenty\\")","text":"int() cannot turn the word \\"twenty\\" into a number, so it raises a ValueError."},{"code":"except ValueError:","text":"Catches exactly that error and runs the friendly message instead."},{"code":"marks = [80, 92, 75]","text":"A list with 3 items, at positions 0, 1 and 2."},{"code":"    print(marks[3])","text":"Position 3 does not exist, so this raises an IndexError."},{"code":"except IndexError:","text":"Catches it and explains the problem using len(marks)."}],"remember":["Read the last line of the traceback first.","Catch a specific error type, not every error.","Printing values in the middle of your code is the simplest debugger."],"task":"Ask for a number with input() and print a friendly message if the user types letters.","video":{"start":3088}},{"id":"intro-project","num":"13","title":"Build a real program","tag":"a quiz game","paras":["Everything comes together here: variables keep the score, a list of dictionaries holds the questions, a loop asks each one, <code>input()</code> takes the answer and <code>if</code> checks it.","Once it works, make it yours: add your own questions, give a grade at the end, or let the player try again."],"code":"questions = [\\n    {\\"q\\": \\"Capital of India? \\", \\"a\\": \\"delhi\\"},\\n    {\\"q\\": \\"5 * 6 = ? \\", \\"a\\": \\"30\\"},\\n]\\nscore = 0\\nfor item in questions:\\n    answer = input(item[\\"q\\"]).strip().lower()\\n    if answer == item[\\"a\\"]:\\n        print(\\"Correct!\\")\\n        score += 1\\n    else:\\n        print(\\"Answer:\\", item[\\"a\\"])\\nprint(f\\"You scored {score}/{len(questions)}\\")","inputs":"Delhi\\n35","output":"Capital of India? Delhi\\nCorrect!\\n5 * 6 = ? 35\\nAnswer: 30\\nYou scored 1/2","explain":[{"code":"questions = [ {...}, {...} ]","text":"A list of dictionaries. Each dictionary holds one question (q) and its answer (a)."},{"code":"score = 0","text":"The player starts with no points."},{"code":"for item in questions:","text":"Goes through the questions one at a time. item is the current dictionary."},{"code":"    answer = input(item[\\"q\\"]).strip().lower()","text":"Asks the question. strip() removes extra spaces and lower() makes Delhi and delhi count the same."},{"code":"    if answer == item[\\"a\\"]:","text":"Compares the player\'s answer with the correct one."},{"code":"        score += 1","text":"Adds a point only for a right answer."},{"code":"print(f\\"You scored {score}/{len(questions)}\\")","text":"After the loop, shows the final score out of the number of questions."}],"remember":["Plan the data first, then the loop.","<code>.strip().lower()</code> forgives extra spaces and capitals.","Build one small piece, run it, then add the next."],"task":"Add three questions of your own and print \\"Topper!\\" for a perfect score.","video":{"start":3259}}]},{"id":"data","topics":[{"id":"data-libraries","num":"01","title":"Libraries","tag":"import superpowers","paras":["A library is code someone else already wrote and tested, ready for you to use. You bring it into your program with <code>import</code>. Python ships with many (math, random, datetime), and the data world runs on two more: NumPy for fast maths on numbers and Pandas for tables.","By convention NumPy is imported as <code>np</code> and Pandas as <code>pd</code>. Google Colab and Kaggle notebooks already have both installed; on your own computer you install them once with <code>pip install numpy pandas</code>."],"code":"import math\\nimport numpy as np\\nimport pandas as pd\\n\\nprint(math.sqrt(144))\\nprint(round(1999 * 0.18, 2))   # GST on Rs 1999\\nprint(math.ceil(4.2))          # always rounds up\\nprint(np.array([1, 2, 3]) * 10)","inputs":null,"output":"12.0\\n359.82\\n5\\n[10 20 30]","explain":[{"code":"import math","text":"Brings in Python\'s built-in maths library so you can use its tools."},{"code":"import numpy as np","text":"Brings in NumPy and gives it the short name np. Everyone uses this name."},{"code":"import pandas as pd","text":"Brings in Pandas with the short name pd."},{"code":"print(math.sqrt(144))","text":"Use a library\'s tool with libraryname.tool. sqrt gives the square root, 12.0."},{"code":"print(round(1999 * 0.18, 2))","text":"18% GST on Rs 1999, rounded to 2 decimal places for money."},{"code":"print(math.ceil(4.2))","text":"ceil always rounds up, so 4.2 becomes 5."},{"code":"print(np.array([1, 2, 3]) * 10)","text":"A first taste of NumPy: every number in the array is multiplied by 10."}],"remember":["<code>import</code> once at the top of your file.","<code>np</code> and <code>pd</code> are the names everyone uses.","Colab and Kaggle need no installation."],"task":"Import random and simulate rolling a dice 5 times.","video":null},{"id":"data-files","num":"02","title":"Files","tag":"data that survives","paras":["Variables vanish when the program ends. Files survive. <code>open()</code> with <code>\\"w\\"</code> writes a new file, <code>\\"a\\"</code> adds to the end, and no mode at all reads it.","The <code>w</code> trap: opening an existing file with <code>\\"w\\"</code> wipes it before writing. Use <code>\\"a\\"</code> when you want to keep what is there.","<code>with open(...) as f:</code> closes the file for you when the block ends. CSV (comma-separated values) is the plain-text format almost all data comes in: one row per line, columns split by commas."],"code":"with open(\\"chai.csv\\", \\"w\\") as f:\\n    f.write(\\"day,cups\\\\n\\")\\n    f.write(\\"Mon,3\\\\n\\")\\n\\nwith open(\\"chai.csv\\", \\"a\\") as f:\\n    f.write(\\"Tue,5\\\\n\\")\\n\\nwith open(\\"chai.csv\\") as f:\\n    print(f.read())","inputs":null,"output":"day,cups\\nMon,3\\nTue,5","explain":[{"code":"with open(\\"chai.csv\\", \\"w\\") as f:","text":"Opens (or creates) the file for writing. \\"w\\" wipes anything already in it. with closes the file automatically at the end."},{"code":"    f.write(\\"day,cups\\\\n\\")","text":"Writes one line. \\\\n means new line, so the next write starts on its own row."},{"code":"with open(\\"chai.csv\\", \\"a\\") as f:","text":"\\"a\\" means append: add to the end and keep what is already there."},{"code":"with open(\\"chai.csv\\") as f:","text":"No mode means read."},{"code":"    print(f.read())","text":"read() gives back the whole file as text, so you see all three rows."}],"remember":["<code>\\"w\\"</code> overwrites, <code>\\"a\\"</code> appends.","Always use <code>with</code> so the file is closed.","A CSV is just text with commas."],"task":"Write a chai counter that appends today\'s cups to a file and prints the total so far.","video":null},{"id":"data-numpy","num":"03","title":"NumPy","tag":"maths on whole lists","paras":["Multiply a Python list by 2 and it repeats the list. Multiply a NumPy array by 2 and every number doubles. That is the whole idea: one operation on every item at once, with no loop, and much faster on big data.","Arrays come with statistics built in (<code>mean()</code>, <code>max()</code>, <code>sum()</code>). You can also ask a yes-or-no question of every item at once and use the answer to filter, like \\"which innings were 50 or more?\\""],"code":"import numpy as np\\n\\nprices = [100, 250, 80]\\nprint(prices * 2)\\nprint(np.array(prices) * 2)\\n\\nruns = np.array([45, 12, 78, 3, 101, 34, 0, 56, 22, 67])\\nprint(\\"Average:\\", runs.mean())\\nprint(\\"Best:\\", runs.max())\\nprint(runs >= 50)\\nprint(\\"Fifties:\\", runs[runs >= 50])","inputs":null,"output":"[100, 250, 80, 100, 250, 80]\\n[200 500 160]\\nAverage: 41.8\\nBest: 101\\n[False False  True False  True False False  True False  True]\\nFifties: [ 78 101  56  67]","explain":[{"code":"prices = [100, 250, 80]","text":"A normal Python list."},{"code":"print(prices * 2)","text":"Multiplying a list repeats it, which is almost never what you want for data."},{"code":"print(np.array(prices) * 2)","text":"Turn it into a NumPy array and * 2 doubles every number instead."},{"code":"runs = np.array([...])","text":"A batter\'s last 10 innings as an array."},{"code":"print(\\"Average:\\", runs.mean())","text":"Arrays have statistics built in. mean() is the average, 41.8."},{"code":"print(runs >= 50)","text":"Asks the question of every innings at once and gives back True or False for each one."},{"code":"print(\\"Fifties:\\", runs[runs >= 50])","text":"Putting that True/False array inside the brackets keeps only the True items: the fifties and hundreds."}],"remember":["A list repeats, an array calculates.","<code>arr[arr &gt;= 50]</code> keeps only the matching items.","Arrays can be 2D tables: <code>arr.shape</code> tells you rows and columns."],"task":"Store a week of temperatures for your city and print the days above the average.","video":null},{"id":"data-pandas","num":"04","title":"Pandas","tag":"Excel inside Python","paras":["Pandas gives you a <code>DataFrame</code>: a table with named columns, like an Excel sheet you control with code. A single column is a <code>Series</code>.","Always start with a first look: <code>head()</code> shows the top rows, <code>shape</code> the size and <code>describe()</code> quick statistics. One bracket <code>df[\\"maths\\"]</code> gives one column; two brackets <code>df[[\\"name\\", \\"maths\\"]]</code> give a smaller table.","Make new columns with plain maths, filter rows with a condition in brackets, and sort with <code>sort_values()</code>. When you combine conditions, use <code>&amp;</code> and put each condition in its own brackets."],"code":"import pandas as pd\\n\\ndf = pd.read_csv(\\"marks.csv\\")\\ndf[\\"total\\"] = df[\\"maths\\"] + df[\\"science\\"]\\nprint(df)\\nprint()\\nprint(df[df[\\"maths\\"] > 70][[\\"name\\", \\"maths\\"]])\\nprint()\\nprint(df.sort_values(\\"total\\", ascending=False).head(2))","inputs":null,"output":"    name  maths  science  total\\n0  Aarav     78       85    163\\n1  Priya     92       88    180\\n2  Rahul     65       70    135\\n3  Sneha     88       94    182\\n\\n    name  maths\\n0  Aarav     78\\n1  Priya     92\\n3  Sneha     88\\n\\n    name  maths  science  total\\n3  Sneha     88       94    182\\n1  Priya     92       88    180","explain":[{"code":"df = pd.read_csv(\\"marks.csv\\")","text":"Reads the file into a DataFrame, a table with named columns. df is the usual name."},{"code":"df[\\"total\\"] = df[\\"maths\\"] + df[\\"science\\"]","text":"Adds two whole columns row by row and saves the result as a new column called total."},{"code":"print(df)","text":"Shows the table with the new column."},{"code":"df[df[\\"maths\\"] > 70]","text":"The inner part asks True/False for every row. The outer df[...] keeps only the True rows."},{"code":"[[\\"name\\", \\"maths\\"]]","text":"Two brackets pick a list of columns, giving a smaller table."},{"code":"df.sort_values(\\"total\\", ascending=False).head(2)","text":"Sorts from highest total to lowest, then head(2) keeps the top two rows."}],"remember":["One bracket = a column, two brackets = a table.","Filters: <code>df[(cond1) &amp; (cond2)]</code>, never <code>and</code>.","<code>loc</code> selects by label, <code>iloc</code> by position."],"task":"Add a percentage column (total out of 200) and show only students above 75%.","video":null},{"id":"data-real","num":"05","title":"Real data from a CSV","tag":"UPI spends, dates, groupby","paras":["One line, <code>pd.read_csv()</code> (or <code>pd.read_excel()</code>), turns a whole file into a table. From there you can ask real money questions: where does my money go?","<code>groupby()</code> answers \\"for each category, how much?\\" in one line. <code>value_counts()</code> tells you how often, <code>sum()</code> tells you how much, and they often give different answers: chai is frequent but cheap, rent is rare but huge.","The average can lie when one big payment pulls it up. The median, the middle value, is often the fairer number. Clean messy text with <code>.str.strip()</code> and <code>.str.title()</code>, and save results with <code>to_csv()</code>."],"code":"import pandas as pd\\n\\nupi = pd.read_csv(\\"upi_spends.csv\\", parse_dates
